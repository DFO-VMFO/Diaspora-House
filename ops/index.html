<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diaspora House — Ops Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0F1417;
  --panel:#151B1F;
  --panel-2:#1C2429;
  --panel-3:#232C31;
  --line:rgba(231,238,240,0.08);
  --line-strong:rgba(231,238,240,0.15);
  --text:#E7EEF0;
  --text-dim:#93A3A8;
  --text-faint:#586669;
  --terracotta:#C1613B;
  --terracotta-2:#DD7C51;
  --ochre:#C89A44;
  --ochre-2:#E2BB6E;
  --good:#5FA86B;
  --good-dim:rgba(95,168,107,0.14);
  --warn:#D6A23C;
  --warn-dim:rgba(214,162,60,0.14);
  --bad:#D0604F;
  --bad-dim:rgba(208,96,79,0.14);
  --radius:8px;
  --shadow:0 16px 40px -20px rgba(0,0,0,0.55);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--ink);color:var(--text);
  font-family:'Inter',sans-serif;font-size:13.5px;
  min-height:100vh;-webkit-font-smoothing:antialiased;
}
::selection{background:var(--ochre);color:#0F1417;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:8px;}
::-webkit-scrollbar-track{background:transparent;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-0.01em;}
.mono{font-family:'IBM Plex Mono',monospace;}
a{color:inherit;}

/* ---------- Shell ---------- */
#shell{display:grid;grid-template-columns:220px 1fr;min-height:100vh;}
@media (max-width:880px){#shell{grid-template-columns:1fr;}}

#sidebar{
  background:var(--panel);border-right:1px solid var(--line);
  padding:18px 12px;display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh;
}
@media (max-width:880px){#sidebar{position:static;height:auto;}}
.org{display:flex;align-items:center;gap:10px;padding:4px 8px 18px;}
.org .mark{width:28px;height:28px;border-radius:6px;background:linear-gradient(135deg,var(--terracotta),var(--ochre));flex-shrink:0;display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:12px;color:#180F09;}
.org .name{font-size:13px;font-weight:600;line-height:1.2;}
.org .name small{display:block;font-family:'IBM Plex Mono',monospace;font-size:9.5px;color:var(--text-faint);letter-spacing:0.06em;margin-top:2px;font-weight:400;}

nav.sidenav{display:flex;flex-direction:column;gap:1px;}
.navitem{
  display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:6px;
  color:var(--text-dim);background:none;border:none;font-size:12.8px;font-weight:500;
  text-align:left;width:100%;
}
.navitem svg{width:15px;height:15px;flex-shrink:0;opacity:0.8;}
.navitem:hover{background:var(--panel-2);color:var(--text);}
.navitem.active{background:var(--panel-3);color:var(--text);border-left:2px solid var(--ochre);padding-left:8px;}
.navitem .count{margin-left:auto;font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--text-faint);}

.sidefoot{margin-top:auto;padding-top:14px;border-top:1px solid var(--line);}
.sync-row{display:flex;align-items:center;gap:7px;padding:6px 8px;font-size:11px;color:var(--text-faint);font-family:'IBM Plex Mono',monospace;}
.sync-row svg{width:13px;height:13px;flex-shrink:0;}
.sync-dot{width:6px;height:6px;border-radius:50%;background:var(--good);flex-shrink:0;box-shadow:0 0 0 3px var(--good-dim);animation:pulse 2.4s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:0.6;}50%{opacity:1;}}
@media (prefers-reduced-motion: reduce){*{animation-duration:.001ms !important;}}

#main{min-width:0;}
header.topbar{
  position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;
  padding:16px 24px;background:rgba(15,20,23,0.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);
}
.topbar h1{font-size:17px;}
.topbar .sub{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--text-faint);margin-top:2px;}
.topbar-actions{display:flex;gap:8px;align-items:center;}

main.view{padding:22px 24px 60px;max-width:1180px;}

/* ---------- Buttons / inputs ---------- */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:6px;font-size:12.5px;font-weight:600;border:1px solid transparent;}
.btn svg{width:13px;height:13px;flex-shrink:0;}
.btn-primary{background:linear-gradient(135deg,var(--terracotta),var(--ochre));color:#170F09;}
.btn-primary:hover{filter:brightness(1.08);}
.btn-ghost{background:none;border-color:var(--line-strong);color:var(--text);}
.btn-ghost:hover{border-color:var(--ochre);color:var(--ochre-2);}
.btn-danger{background:none;border-color:var(--bad);color:var(--bad);}
.btn-danger:hover{background:var(--bad-dim);}
.btn-sm{padding:5px 10px;font-size:11.5px;}
.btn[disabled]{opacity:0.4;pointer-events:none;}
.iconbtn{width:30px;height:30px;border-radius:6px;border:1px solid var(--line-strong);background:none;color:var(--text-dim);display:flex;align-items:center;justify-content:center;}
.iconbtn svg{width:14px;height:14px;}
.iconbtn:hover{color:var(--text);border-color:var(--ochre);}

.field{margin-bottom:12px;}
.field label{display:block;font-size:11px;font-family:'IBM Plex Mono',monospace;letter-spacing:0.04em;color:var(--text-faint);margin-bottom:6px;text-transform:uppercase;}
input[type=text],input[type=number],input[type=date],select,textarea{
  width:100%;background:var(--panel-2);border:1px solid var(--line-strong);border-radius:6px;
  padding:9px 10px;color:var(--text);font-size:13px;
}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ochre);}
textarea{resize:vertical;min-height:60px;}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.checkbox-row{display:flex;align-items:center;gap:8px;font-size:12.8px;color:var(--text-dim);}

/* ---------- Tables ---------- */
.tablewrap{border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:var(--panel);}
table{width:100%;border-collapse:collapse;}
thead th{
  text-align:left;padding:9px 14px;font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:0.05em;
  color:var(--text-faint);text-transform:uppercase;font-weight:500;border-bottom:1px solid var(--line);
  background:var(--panel-2);
}
tbody tr{border-bottom:1px solid var(--line);border-left:3px solid transparent;}
tbody tr:last-child{border-bottom:none;}
tbody tr:hover{background:var(--panel-2);}
tbody tr.status-active{border-left-color:var(--ochre);}
tbody tr.status-pending{border-left-color:var(--text-faint);}
tbody tr.status-flagged{border-left-color:var(--bad);}
td{padding:10px 14px;vertical-align:middle;}
td.num{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--text-dim);}
.rowtitle{font-weight:600;font-size:13px;}
.rowsub{font-size:11.5px;color:var(--text-faint);margin-top:2px;}
.rowactions{display:flex;gap:6px;justify-content:flex-end;}

.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.03em;text-transform:uppercase;}
.badge.active{background:var(--good-dim);color:var(--good);}
.badge.pending{background:rgba(88,102,105,0.2);color:var(--text-dim);}
.badge.flagged{background:var(--bad-dim);color:var(--bad);}
.badge.maintenance{background:var(--warn-dim);color:var(--warn);}
.badge.applied{background:rgba(88,102,105,0.2);color:var(--text-dim);}
.badge.interview{background:var(--warn-dim);color:var(--warn);}
.badge.decision{background:rgba(214,160,60,0.18);color:var(--ochre-2);}
.badge.admitted{background:var(--good-dim);color:var(--good);}
.badge.declined{background:var(--bad-dim);color:var(--bad);}
.pipeline{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:16px;}
@media (max-width:880px){.pipeline{grid-template-columns:repeat(2,1fr);}}
.pipeline .stage{border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px;background:var(--panel);}
.pipeline .stage .n{font-family:'IBM Plex Mono',monospace;font-size:20px;font-weight:600;}
.pipeline .stage .l{font-size:10.5px;color:var(--text-faint);text-transform:uppercase;letter-spacing:0.05em;margin-top:2px;}
.history{margin-top:14px;border-top:1px solid var(--line);padding-top:10px;}
.history h4{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:0.05em;text-transform:uppercase;color:var(--text-faint);margin-bottom:6px;}
.history .h-row{font-size:12px;color:var(--text-dim);padding:3px 0;}
.iconbtn.ok{color:var(--good);}
.iconbtn.no{color:var(--bad);}

/* ---------- KPI / dashboard ---------- */
.kpi[data-action]{transition:border-color .15s;}
.kpi[data-action]:hover{border-color:var(--ochre-2);}
.alert-row[data-action]:hover,.activity-row[data-action]:hover{background:rgba(214,160,60,0.06);}
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:26px;}
@media (max-width:880px){.kpi-grid{grid-template-columns:repeat(2,1fr);}}
.kpi{border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;background:var(--panel);}
.kpi .num{font-family:'IBM Plex Mono',monospace;font-size:26px;font-weight:600;color:var(--text);}
.kpi .label{font-size:11px;color:var(--text-faint);margin-top:4px;}
.kpi .delta{font-size:11px;margin-top:6px;font-family:'IBM Plex Mono',monospace;}
.kpi .delta.up{color:var(--good);}

.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:10px;flex-wrap:wrap;}
.searchbox{position:relative;flex:1;max-width:280px;}
.searchbox input{padding-left:30px;}
.searchbox svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);width:14px;height:14px;color:var(--text-faint);}

.empty{padding:40px 20px;text-align:center;color:var(--text-faint);}
.empty h3{color:var(--text-dim);font-size:14px;margin-bottom:4px;}

.two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
@media (max-width:880px){.two-col{grid-template-columns:1fr;}}
.panel-head{padding:11px 14px;border-bottom:1px solid var(--line);background:var(--panel-2);font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:0.05em;text-transform:uppercase;color:var(--text-faint);}
.panel-head svg{width:11px;height:11px;vertical-align:-1px;margin-right:3px;}
.alert-row{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);font-size:12.5px;}
.alert-row:last-child{border-bottom:none;}
.alert-row svg{width:15px;height:15px;flex-shrink:0;}
.alert-row.bad svg{color:var(--bad);}
.alert-row.warn svg{color:var(--warn);}
.alert-row .go{margin-left:auto;font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--text-faint);flex-shrink:0;background:none;border:none;cursor:pointer;}
.alert-row .go:hover{color:var(--ochre-2);}
.activity-row{display:flex;gap:8px;align-items:baseline;padding:9px 14px;border-bottom:1px solid var(--line);font-size:12.3px;color:var(--text-dim);}
.activity-row:last-child{border-bottom:none;}
.activity-row .who{color:var(--ochre-2);font-weight:600;flex-shrink:0;}
.activity-row .when{margin-left:auto;font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--text-faint);flex-shrink:0;white-space:nowrap;}

/* ---------- Modal ---------- */
.modal-overlay{position:fixed;inset:0;background:rgba(6,8,9,0.7);backdrop-filter:blur(2px);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;}
.modal{width:100%;max-width:520px;max-height:88vh;overflow-y:auto;background:var(--panel);border:1px solid var(--line-strong);border-radius:12px;padding:22px;box-shadow:var(--shadow);}
.modal-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px;}
.modal-head h3{font-size:16px;}
.modal-head .sub{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--text-faint);margin-top:3px;}
.modal-close{width:26px;height:26px;border-radius:6px;border:none;background:none;color:var(--text-faint);display:flex;align-items:center;justify-content:center;}
.modal-close svg{width:14px;height:14px;}
.modal-close:hover{color:var(--text);background:var(--panel-2);}
.modal-foot{display:flex;justify-content:space-between;gap:10px;margin-top:18px;padding-top:14px;border-top:1px solid var(--line);}

/* ---------- Nested list (products within vendor, etc) ---------- */
.nested-list{display:flex;flex-direction:column;gap:8px;margin-top:6px;}
.nested-item{border:1px solid var(--line);border-radius:6px;padding:9px 11px;display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--panel-2);}
.nested-item .info{font-size:12.5px;}
.nested-item .info .t{font-weight:600;}
.nested-item .info .s{color:var(--text-faint);font-size:11px;margin-top:2px;}

#toast-root{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;}
.toast{background:var(--panel-3);border:1px solid var(--ochre);border-radius:8px;padding:9px 16px;font-size:12px;color:var(--text);box-shadow:var(--shadow);}

.loading-screen{position:fixed;inset:0;background:var(--ink);z-index:500;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;}
.loading-screen .mono{color:var(--text-faint);font-size:12px;}
</style>
</head>
<body>
<div id="shell"></div>
<div id="modal-root"></div>
<div id="toast-root"></div>
<div class="loading-screen" id="boot-screen">
  <div class="mark" style="width:34px;height:34px;border-radius:8px;background:linear-gradient(135deg,#C1613B,#C89A44);"></div>
  <div class="mono">Connecting to shared storage…</div>
</div>
<script>
/* ---------------- Database connection (Supabase) ----------------
   Both apps talk to one shared key/value table in Supabase. Staff sign in with a House account;
   the database itself decides what each role may read and change (row-level security).
   With no connection configured they keep using the platform's shared storage exactly as before. */
/* Connected to the Diaspora-House Supabase project. Staff sign in with an emailed one-time code (no passwords). */
window.DH_CONFIG = window.DH_CONFIG || {supabaseUrl:'https://eptsqnvenmllmzshigoi.supabase.co', supabaseKey:'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVwdHNxbnZlbm1sbG16c2hpZ29pIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIwMDM2NjIsImV4cCI6MjEwNzU3OTY2Mn0.OXqgEbP29xHd_PpCHPa57WGoqwi3Xi_jwWIvem0cT5o', requireLogin:true};
const DH_DB = (function(){
  const LS = 'dh_sb', LSS = 'dh_session';
  const KEYS = ['ops:inventory','ops:roster','ops:shifts','ops:revenue','ops:providers','ops:jobs','ops:budgets','ops:members','ops:spaces','ops:events','ops:souk_vendors','ops:academy_classes','ops:talent_directory','ops:language_tables','ops:locations','ops:activity_log','ops:applications','ops:circles','ops:requests','ops:bookings','ops:rsvps','ops:souk_reservations','ops:enrollments','ops:job_responses','ops:ticket_orders','ops:member_dues','ops:event_series'];
  const db = {status:'off', lastError:'', KEYS, profile:null, onAuthLost:null};
  let underlying = window.storage;
  const mem = {};
  let session = null; try{ session = JSON.parse(localStorage.getItem(LSS)||'null'); }catch(e){}
  db.platform = () => underlying;
  db.config = function(){
    try{ const s = JSON.parse(localStorage.getItem(LS)||'null'); if(s && s.url && s.key) return {url:String(s.url).replace(/\/+$/,''), key:s.key, auth:false}; }catch(e){}
    const c = window.DH_CONFIG||{};
    return (c.supabaseUrl && c.supabaseKey) ? {url:String(c.supabaseUrl).replace(/\/+$/,''), key:c.supabaseKey, auth:!!c.requireLogin} : null;
  };
  db.save = (url,key) => { try{ localStorage.setItem(LS, JSON.stringify({url,key})); return true; }catch(e){ return false; } };
  db.clear = () => { try{ localStorage.removeItem(LS); }catch(e){} };
  db.active = () => !!db.config();
  db.authMode = () => { const c = db.config(); return !!(c && c.auth); };
  db.session = () => session;
  db.needsLogin = () => db.authMode() && !session;
  function setSession(j){
    session = {access_token:j.access_token, refresh_token:j.refresh_token, expires_at: j.expires_at || (Math.floor(Date.now()/1000)+(j.expires_in||3600)), user: j.user ? {id:j.user.id, email:j.user.email} : (session && session.user)};
    try{ localStorage.setItem(LSS, JSON.stringify(session)); }catch(e){}
  }
  db.signOutLocal = () => { session = null; db.profile = null; try{ localStorage.removeItem(LSS); }catch(e){} };
  async function fetchT(url, opts){
    const ctl = (typeof AbortController!=='undefined') ? new AbortController() : null;
    const t = ctl ? setTimeout(()=>ctl.abort(), 8000) : null;
    try{ return await fetch(url, Object.assign({signal: ctl?ctl.signal:undefined}, opts)); } finally { if(t) clearTimeout(t); }
  }
  db.refresh = async function(){
    const cfg = db.config(); if(!cfg || !session || !session.refresh_token) return false;
    try{
      const res = await fetchT(cfg.url+'/auth/v1/token?grant_type=refresh_token', {method:'POST', headers:{apikey:cfg.key, 'Content-Type':'application/json'}, body:JSON.stringify({refresh_token:session.refresh_token})});
      if(!res.ok){ db.signOutLocal(); if(db.onAuthLost) db.onAuthLost(); return false; }
      setSession(await res.json()); return true;
    }catch(e){ return false; }
  };
  async function call(cfg, path, opts, useSession){
    if(useSession!==false && session && session.expires_at && session.expires_at*1000 - Date.now() < 60000) await db.refresh();
    const send = () => fetchT(cfg.url+'/rest/v1/'+path, Object.assign({}, opts, {headers:Object.assign({apikey:cfg.key, Authorization:'Bearer '+((useSession!==false && session)?session.access_token:cfg.key), 'Content-Type':'application/json'}, (opts&&opts.headers)||{})}));
    let res = await send();
    if(res.status===401 && useSession!==false && session){ if(await db.refresh()) res = await send(); else { if(db.onAuthLost) db.onAuthLost(); } }
    return res;
  }
  function fail(msg){ db.status='error'; db.lastError=msg; throw new Error(msg); }
  async function sbGet(key){
    const cfg = db.config();
    let res; try{ res = await call(cfg, 'kv?key=eq.'+encodeURIComponent(key)+'&select=value'); }catch(e){ fail('Cannot reach the database ('+(e&&e.message||'network')+')'); }
    if(!res.ok) fail('Database said '+res.status);
    const rows = await res.json(); db.status='ok'; db.lastError='';
    if(!rows.length) throw new Error('not found');
    return {key, value: JSON.stringify(rows[0].value), shared:true};
  }
  async function sbSet(key, value){
    const cfg = db.config(); let parsed; try{ parsed = JSON.parse(value); }catch(e){ parsed = value; }
    let res; try{ res = await call(cfg, 'kv?on_conflict=key', {method:'POST', headers:{Prefer:'resolution=merge-duplicates,return=minimal'}, body:JSON.stringify({key, value:parsed})}); }catch(e){ fail('Cannot reach the database ('+(e&&e.message||'network')+')'); }
    if(!res.ok){
      if(res.status===401 || res.status===403){ db.lastError='Your role cannot change this ('+key+')'; throw new Error(db.lastError); }
      fail('Database refused the write ('+res.status+')');
    }
    db.status='ok'; db.lastError=''; return {key, value, shared:true};
  }
  const personalGet = async key => {
    if(underlying && typeof underlying.get==='function'){ try{ return await underlying.get(key,false); }catch(e){} }
    let v = null; try{ v = localStorage.getItem('dh_p_'+key); }catch(e){}
    if(v===null) v = (key in mem) ? mem[key] : null;
    if(v===null) throw new Error('not found');
    return {key, value:v, shared:false};
  };
  const personalSet = async (key, value) => {
    if(underlying && typeof underlying.set==='function'){ try{ return await underlying.set(key,value,false); }catch(e){} }
    mem[key]=value; try{ localStorage.setItem('dh_p_'+key, value); }catch(e){} return {key, value, shared:false};
  };
  const shim = {
    async get(key, shared){ if(shared===undefined) shared = false; return shared ? sbGet(key) : personalGet(key); },
    async set(key, value, shared){ if(shared===undefined) shared = false; return shared ? sbSet(key, value) : personalSet(key, value); },
  };
  try{
    Object.defineProperty(window, 'storage', {configurable:true, get(){ return db.active() ? shim : underlying; }, set(v){ underlying = v; }});
  }catch(e){}
  /* ---- sign in ---- */
  db.signIn = async function(email, password){
    const cfg = db.config(); if(!cfg) return {ok:false, msg:'No database is set up.'};
    const em = String(email||'').trim();
    let res; try{
      if(/@house\.diaspora\.test$/i.test(em)){ // mock demo accounts: any password opens them (server refuses real accounts)
        res = await fetchT(cfg.url+'/functions/v1/demo-login', {method:'POST', headers:{apikey:cfg.key, Authorization:'Bearer '+cfg.key, 'Content-Type':'application/json'}, body:JSON.stringify({email:em})});
      } else {
        res = await fetchT(cfg.url+'/auth/v1/token?grant_type=password', {method:'POST', headers:{apikey:cfg.key, 'Content-Type':'application/json'}, body:JSON.stringify({email:em, password:String(password||'')})});
      }
    }
    catch(e){ return {ok:false, msg:'Could not reach the sign-in service.'}; }
    if(!res.ok) return {ok:false, msg:'That email and password do not match.'};
    setSession(await res.json());
    const p = await db.loadProfile();
    if(!p){ db.signOutLocal(); return {ok:false, msg:'This account is not on the House team.'}; }
    return {ok:true, profile:p};
  };

  /* edge functions and private document storage, always as the signed-in user */
  async function freshToken(){
    if(session && session.expires_at && session.expires_at < Math.floor(Date.now()/1000)+60){ try{ await db.refresh(); }catch(e){} }
    return session ? session.access_token : null;
  }
  db.fn = async function(name, body){
    const cfg = db.config(); if(!cfg) return {ok:false, status:0, data:{}};
    const tok = await freshToken();
    try{
      const res = await fetch(cfg.url+'/functions/v1/'+name, {method:'POST', headers:{apikey:cfg.key, Authorization:'Bearer '+(tok||cfg.key), 'Content-Type':'application/json'}, body:JSON.stringify(body||{})});
      let data = {}; try{ data = await res.json(); }catch(e){}
      return {ok:res.ok, status:res.status, data};
    }catch(e){ return {ok:false, status:0, data:{}}; }
  };
  db.uploadDoc = async function(path, file){
    const cfg = db.config(); if(!cfg) return {ok:false, msg:'No database is set up.'};
    const tok = await freshToken(); if(!tok) return {ok:false, msg:'Sign in first.'};
    try{
      const res = await fetch(cfg.url+'/storage/v1/object/provider-docs/'+path.split('/').map(encodeURIComponent).join('/'), {method:'POST', headers:{apikey:cfg.key, Authorization:'Bearer '+tok, 'Content-Type':file.type||'application/octet-stream', 'x-upsert':'false'}, body:file});
      if(!res.ok){ let m=''; try{ m=(await res.json()).message||''; }catch(e){} return {ok:false, msg:m||('error '+res.status)}; }
      return {ok:true};
    }catch(e){ return {ok:false, msg:'network problem'}; }
  };
  db.docUrl = async function(path){
    const cfg = db.config(); const tok = await freshToken(); if(!cfg||!tok) return null;
    try{
      const res = await fetch(cfg.url+'/storage/v1/object/sign/provider-docs/'+path.split('/').map(encodeURIComponent).join('/'), {method:'POST', headers:{apikey:cfg.key, Authorization:'Bearer '+tok, 'Content-Type':'application/json'}, body:JSON.stringify({expiresIn:300})});
      if(!res.ok) return null; const j = await res.json(); return j.signedURL ? cfg.url+'/storage/v1'+j.signedURL : null;
    }catch(e){ return null; }
  };
  db.removeDoc = async function(path){
    const cfg = db.config(); const tok = await freshToken(); if(!cfg||!tok) return false;
    try{ const res = await fetch(cfg.url+'/storage/v1/object/provider-docs/'+path.split('/').map(encodeURIComponent).join('/'), {method:'DELETE', headers:{apikey:cfg.key, Authorization:'Bearer '+tok}}); return res.ok; }catch(e){ return false; }
  };

  /* passwordless sign-in: Supabase emails a one-time code to a team member */
  db.sendCode = async function(email){
    const cfg = db.config(); if(!cfg) return {ok:false, msg:'No database is set up.'};
    const em = String(email||'').trim().toLowerCase(); if(!/^\S+@\S+\.\S+$/.test(em)) return {ok:false, msg:'Enter your work email.'};
    let res; try{ res = await fetchT(cfg.url+'/functions/v1/send-code', {method:'POST', headers:{apikey:cfg.key, Authorization:'Bearer '+cfg.key, 'Content-Type':'application/json'}, body:JSON.stringify({email:em})}); }
    catch(e){ return {ok:false, msg:'Could not reach the sign-in service.'}; }
    if(res.status===429) return {ok:false, msg:'Too many codes requested. Wait ten minutes and try again.'};
    if(!res.ok) return {ok:false, msg:'Could not send the code. Try again in a moment.'};
    return {ok:true, msg:'If that email is on the House team, a sign-in code is on its way.'};
  };
  db.verifyCode = async function(email, code){
    const cfg = db.config(); if(!cfg) return {ok:false, msg:'No database is set up.'};
    const em = String(email||'').trim().toLowerCase(), tok = String(code||'').replace(/\D/g,'');
    if(tok.length<6) return {ok:false, msg:'Enter the code from the email.'};
    let res; try{ res = await fetchT(cfg.url+'/auth/v1/verify', {method:'POST', headers:{apikey:cfg.key, 'Content-Type':'application/json'}, body:JSON.stringify({type:'email', email:em, token:tok})}); }
    catch(e){ return {ok:false, msg:'Could not reach the sign-in service.'}; }
    if(!res.ok) return {ok:false, msg:'That code is wrong or has expired. Ask for a new one.'};
    setSession(await res.json());
    const p = await db.loadProfile();
    if(!p){ db.signOutLocal(); return {ok:false, msg:'This account is not on the House team.'}; }
    return {ok:true, profile:p};
  };
  db.loadProfile = async function(){
    const cfg = db.config(); if(!cfg || !session) return null;
    try{
      const res = await call(cfg, 'staff_profiles?select=display_name,title,role,email&active=eq.true&user_id=eq.'+encodeURIComponent(session.user.id));
      if(!res.ok) return null;
      const rows = await res.json(); db.profile = rows[0] || null; return db.profile;
    }catch(e){ return null; }
  };
  db.team = async function(){
    const cfg = db.config(); if(!cfg || !session) return [];
    try{ const res = await call(cfg, 'staff_profiles?select=display_name,title,role,email&active=eq.true&order=role'); return res.ok ? await res.json() : []; }catch(e){ return []; }
  };
  db.signOut = async function(){
    const cfg = db.config();
    if(cfg && session){ try{ await fetchT(cfg.url+'/auth/v1/logout', {method:'POST', headers:{apikey:cfg.key, Authorization:'Bearer '+session.access_token}}); }catch(e){} }
    db.signOutLocal();
  };
  db.test = async function(url, key){
    const cfg = {url:String(url||'').trim().replace(/\/+$/,''), key:String(key||'').trim()};
    if(!/^https:\/\/.+/.test(cfg.url)) return {ok:false, msg:'The URL should start with https:// (find it in Supabase under Project Settings, API).'};
    if(!cfg.key) return {ok:false, msg:'Paste the anon public key.'};
    let res; try{ res = await call(cfg, 'kv?select=key&limit=1', undefined, false); }catch(e){ return {ok:false, msg:'Could not reach that address. '+(e&&e.message||'')}; }
    if(res.ok) return {ok:true, msg:'Connected. The kv table is there.'};
    let body = ''; try{ body = await res.text(); }catch(e){}
    if(res.status===404 || /PGRST205|relation .* does not exist|schema cache/i.test(body)) return {ok:false, msg:'Connected, but the kv table does not exist yet.'};
    if(res.status===401 || res.status===403) return {ok:false, msg:'Supabase refused the key. Check that it is the anon public key.'};
    return {ok:false, msg:'Supabase answered '+res.status+'.'};
  };
  db.migrate = async function(){
    const src = underlying; if(!src || typeof src.get!=='function') return {copied:0, skipped:0, none:true};
    let copied = 0, skipped = 0;
    for(const k of KEYS){
      let have = true; try{ await sbGet(k); }catch(e){ have = (e.message!=='not found'); }
      if(have){ skipped++; continue; }
      let r = null; try{ r = await src.get(k, true); }catch(e){}
      if(r && r.value!=null){ await sbSet(k, r.value); copied++; }
    }
    return {copied, skipped};
  };
  return db;
})();

function dbSay(msg, good){ const m = document.getElementById('db-msg'); if(m){ m.textContent = msg; m.style.color = good===true?'var(--ok, #6fbf8f)':(good===false?'var(--bad, #d98080)':'var(--text-faint)'); } }
function dbAction(action){
  const val = id => { const e = document.getElementById(id); return e ? e.value.trim() : ''; };
  if(action==='open-db'){ state.modal = {type:'db'}; renderModal(); return true; }
  if(action==='db-sendcode'){
    const say=(t,bad)=>{ const m=document.getElementById('login-msg'); if(m){ m.textContent=t; m.style.color=bad?'var(--bad, #d98080)':'var(--text-faint)'; } };
    say('Sending…');
    DH_DB.sendCode(val('login-email')).then(r=>{
      say(r.msg, !r.ok); if(!r.ok) return;
      document.getElementById('login-code-wrap').style.display=''; const btn=document.getElementById('login-btn'); btn.textContent='Sign in'; btn.dataset.action='db-verify';
      const c=document.getElementById('login-code'); if(c) c.focus();
    });
    return true;
  }
  if(action==='db-verify'){
    const m=document.getElementById('login-msg'); if(m){ m.textContent='Checking…'; m.style.color='var(--text-faint)'; }
    DH_DB.verifyCode(val('login-email'), val('login-code')).then(r=>{
      if(!r.ok){ const m2=document.getElementById('login-msg'); if(m2){ m2.textContent=r.msg; m2.style.color='var(--bad, #d98080)'; } return; }
      if(typeof dhAfterLogin==='function') dhAfterLogin();
    });
    return true;
  }
  if(action==='db-reseed'){
    if(!window.confirm('Replace ALL shared data (members, budgets, providers, everything) with the built-in sample data? Anything you entered will be lost.')) return true;
    dbSay('Resetting…');
    (async()=>{ try{ for(const e of ENTITY_ORDER){ if(e==='rsvps'||e==='tickets') continue; state.data[e] = JSON.parse(JSON.stringify(SEED[e]||[])); await storageSet(STORAGE_KEYS[e], state.data[e]); } dbSay('Done. Sample data restored.', true); render(); }catch(err){ dbSay('Reset failed: '+(err&&err.message||err), false); } })();
    return true;
  }
  if(action==='db-signout'){ DH_DB.signOut().then(()=>{ try{ location.reload(); }catch(e){} }); return true; }
  if(action==='db-test'){ dbSay('Testing…'); DH_DB.test(val('db-url'), val('db-key')).then(r=>dbSay(r.msg, r.ok)); return true; }
  if(action==='db-save'){
    dbSay('Checking before saving…');
    DH_DB.test(val('db-url'), val('db-key')).then(r=>{
      if(!r.ok){ dbSay(r.msg, false); return; }
      DH_DB.save(val('db-url').replace(/\/+$/,''), val('db-key'));
      dbSay('Saved. Reloading to use it…', true);
      setTimeout(()=>{ try{ location.reload(); }catch(e){} }, 400);
    });
    return true;
  }
  if(action==='db-disconnect'){ DH_DB.clear(); dbSay('Disconnected. Reloading…', true); setTimeout(()=>{ try{ location.reload(); }catch(e){} }, 400); return true; }
  if(action==='db-migrate'){
    dbSay('Copying…');
    DH_DB.migrate().then(r=>dbSay(r.none ? 'No platform storage to copy from.' : `Copied ${r.copied} data sets. ${r.skipped} already existed and were left alone.`, true)).catch(e=>dbSay('Copy failed: '+e.message, false));
    return true;
  }
  return false;
}

async function storageGet(key, shared){
  if(shared===undefined) shared = true;
  try{
    const res = await window.storage.get(key, shared);
    if(!res || res.value == null) return null;
    return JSON.parse(res.value);
  }catch(e){ return null; } // missing key or transient issue — caller falls back to a default
}
async function storageSet(key, value, shared){
  if(shared===undefined) shared = true;
  if(typeof window.storage==='undefined' || !window.storage || typeof window.storage.set!=='function') return false; // nothing to retry against
  for(let attempt=1; attempt<=2; attempt++){
    try{
      await window.storage.set(key, JSON.stringify(value), shared);
      return true;
    }catch(e){
      if(attempt===2){ console.warn('Diaspora House Ops: could not save "'+key+'" after retrying — will retry on next change.'); return false; }
      await sleep(250);
    }
  }
  return false;
}

const PROVIDER_CATEGORIES = [
  'Tailoring & Wardrobe','Chef Experiences & Private Dining','Luxury Concierge','Membership Club Partnerships',
  'Event Production & Design','Event Trends & Programming','Family Office Services','Transportation & Security',
  'Wellness & Recovery','Photography & Content'
];
const JOB_STATUSES = ['new','offered','accepted','in progress','completed','declined','expired','cancelled'];
const JOB_BADGE = {new:'decision', offered:'interview', accepted:'active', 'in progress':'interview', completed:'admitted', declined:'flagged', expired:'flagged', cancelled:'pending'};
const BUDGET_CATEGORIES = ['Food & Beverage','Venue & Rentals','Entertainment & Talent','Decor & Florals','AV & Production','Staffing','Marketing & Print','Transportation','Supplies & Inventory','Provider Services','Contingency','Other'];

function provById(id){ return (state.data.providers||[]).find(p=>p.id===id); }
function provByName(n){ return (state.data.providers||[]).find(p=>p.name===n); }
function money(n){ return '$'+(Math.round(Number(n)||0)).toLocaleString(); }
function fmtDur(ms){ const m = Math.round(Math.abs(ms)/60000); if(m<60) return m+'m'; const h = Math.floor(m/60); if(h<48) return h+'h '+(m%60)+'m'; return Math.floor(h/24)+'d '+(h%24)+'h'; }
function fmtWhen(iso){ if(!iso) return '—'; const d = new Date(iso); if(isNaN(d)) return esc(iso); return d.toLocaleDateString([], {month:'short', day:'numeric'})+' '+d.toLocaleTimeString([], {hour:'numeric', minute:'2-digit'}); }
function toLocalInput(ms){ const d = new Date(ms); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,16); }
function memberShort(name){ const p = String(name||'A member').trim().split(/\s+/); return p.length>1 ? p[0]+' '+p[p.length-1][0]+'.' : p[0]; }
function leadWarning(j, p){
  if(!j || !p || !j.neededBy || !p.minLeadHours) return '';
  const h = (new Date(j.neededBy).getTime()-Date.now())/3600000;
  if(isNaN(h)) return '';
  return h < p.minLeadHours ? `${p.name} needs ${p.minLeadHours}h notice; only ${Math.max(0,Math.floor(h))}h left.` : '';
}
function jobLog(j, text){ (j.history = j.history||[]).push({at:new Date().toISOString(), by:state.staffName||'Staff', text}); }
function jobTimer(j){
  if(j.status!=='offered' || !j.responseDueAt) return '';
  const left = new Date(j.responseDueAt).getTime()-Date.now();
  return left>=0 ? `<span style="color:var(--warn);">${fmtDur(left)} left to reply</span>` : `<span style="color:var(--bad);">No reply · ${fmtDur(left)} overdue</span>`;
}
function guessCategory(r){
  const t = (r.type||'')+' '+(r.summary||'')+' '+(r.details||'');
  if(/tailor|clothes|wardrobe|suit|fitting|dress|alteration/i.test(t)) return 'Tailoring & Wardrobe';
  if(/chef|dinner|tasting|culinary|private dining|menu/i.test(t)) return 'Chef Experiences & Private Dining';
  if(/car|driver|security|transport/i.test(t)) return 'Transportation & Security';
  if(/tax|estate|legal|wealth|family office|insurance/i.test(t)) return 'Family Office Services';
  if(/photo|film|video|content/i.test(t)) return 'Photography & Content';
  if(/club|reciprocal/i.test(t)) return 'Membership Club Partnerships';
  return 'Luxury Concierge';
}
function budgetSpend(b){
  const lines = b.lines||[], exp = b.expenses||[];
  const jobs = (state.data.jobs||[]).filter(j=>j.budgetId===b.id);
  const jobsDone = jobs.filter(j=>j.status==='completed').reduce((s,j)=>s+(Number(j.cost)||0),0);
  const committed = jobs.filter(j=>['offered','accepted','in progress'].includes(j.status)).reduce((s,j)=>s+(Number(j.cost)||0),0);
  const expTotal = exp.reduce((s,e)=>s+(Number(e.amount)||0),0);
  const planned = lines.reduce((s,l)=>s+(Number(l.planned)||0),0);
  const cap = Number(b.approved)||planned;
  return {planned, cap, expTotal, jobsDone, committed, spent:expTotal+jobsDone, jobs};
}
function budgetColor(pct){ return pct>100 ? 'var(--bad)' : (pct>=85 ? 'var(--warn)' : 'var(--good)'); }

/* ---- dispatch logic ---- */
function dispatchJob(j, p){
  const hrs = p.responseHours||4;
  j.providerId = p.id; j.providerName = p.name; j.status = 'offered';
  j.offeredAt = new Date().toISOString();
  j.responseDueAt = new Date(Date.now()+hrs*3600000).toISOString();
  j.token = Math.random().toString(36).slice(2,10)+Math.random().toString(36).slice(2,6);
  jobLog(j, `Offer to ${p.name} — reply within ${hrs}h`);
  deliverOffer(j, p);
}
function offerLink(j){ try{ const u = new URL('../j/', location.href); return u.protocol==='https:' ? u.href+'?t='+j.token : ''; }catch(e){ return ''; } }
function offerMessage(j, p){
  const text = `New request from Diaspora House: ${j.summary}.\nFor ${memberShort(j.member)}. Needed ${fmtWhen(j.neededBy)}${j.location&&j.location!=='—'?' · '+j.location:''}.\nPays ${money(j.cost)}. Please reply within ${p.responseHours||4} hours.`;
  return {text, link: offerLink(j)};
}
async function deliverOffer(j, p){
  let note;
  const via = p.notifyVia||'SMS';
  if(!DH_DB.active() || !DH_DB.session()){ note = 'not sent (sign in with the database connected to send email)'; }
  else if(!p.email){ note = via==='Email' ? 'not sent: no email on file' : `not sent: ${via} is not set up yet and there is no email on file`; }
  else {
    const m = offerMessage(j, p);
    const r = await DH_DB.fn('send-offer', {to:p.email, subject:'New request: '+j.summary, text:m.text, link:m.link});
    note = r.data && r.data.delivered ? (via==='Email' ? 'emailed' : `emailed (${via} is not set up yet)`) : (r.data && r.data.reason==='no_real_email' ? 'not sent: that is a sample email address' : 'email failed, try Resend');
  }
  jobLog(j, `Delivery to ${p.name}: ${note}`); touch(j); await persist('jobs');
  if(!state.modal || state.modal.type==='job') render();
}
async function applyJobResponses(){
  if(!DH_DB.active() || !canWrite('jobs')) return;
  const offered=(state.data.jobs||[]).filter(j=>j.status==='offered' && j.token); if(!offered.length) return;
  const resp = await storageGet('ops:job_responses'); if(!resp || typeof resp!=='object') return;
  let n=0;
  offered.forEach(j=>{
    const r=resp[j.token]; if(!r || String(r.at)<=String(j.offeredAt||'')) return;
    if(r.action==='accept'){ j.status='accepted'; j.respondedAt=r.at; jobLog(j, `${j.providerName} accepted from their link`); }
    else { escalateJob(j, `${j.providerName} declined from their link`); }
    touch(j); n++;
  });
  if(n){ await persist('jobs'); logActivity('updated','jobs',`${n} provider repl${n>1?'ies':'y'} received`); toast(`${n} provider repl${n>1?'ies':'y'} received.`); if(!state.modal || state.modal.type==='job') render(); }
}
function escalateJob(j, reason){
  const cur = provById(j.providerId);
  j.tried = j.tried||[]; if(cur && !j.tried.includes(cur.id)) j.tried.push(cur.id);
  const b = cur ? provById(cur.backupId) : null;
  if(b && b.status==='active' && !j.tried.includes(b.id)){ jobLog(j, `${reason} — escalated to backup ${b.name}`); dispatchJob(j, b); return b; }
  j.status = /declined/.test(reason) ? 'declined' : 'expired';
  jobLog(j, `${reason} — no backup available, needs a new provider`);
  return null;
}
function jobSweep(){
  let changed = 0;
  (state.data.jobs||[]).forEach(j=>{
    if(j.status==='offered' && j.responseDueAt && new Date(j.responseDueAt).getTime() < Date.now()){
      escalateJob(j, `${j.providerName||'Provider'} did not reply in time`); touch(j); changed++;
    }
  });
  if(changed){ persist('jobs'); logActivity('updated','jobs',`${changed} overdue offer${changed>1?'s':''} escalated`); }
  if(changed || (!state.modal && ['jobs','dashboard'].includes(state.view))){
    if(!state.modal || state.modal.type==='job') render();
  }
  if(changed) toast(`${changed} provider offer${changed>1?'s':''} went unanswered and moved on.`);
}
function suggestProviders(j){
  let list = (state.data.providers||[]).filter(p=>p.status==='active' && p.category===j.category);
  if(!list.length) list = (state.data.providers||[]).filter(p=>p.status==='active');
  const tried = j.tried||[];
  return list.slice().sort((a,b)=>(tried.includes(a.id)?1:0)-(tried.includes(b.id)?1:0) || (b.quality||0)-(a.quality||0)).map(p=>({
    p, label: `${p.name} · ★${(p.quality||0).toFixed(1)} · ${p.minLeadHours||0}h notice${leadWarning(j,p)?' ⚠ short notice':''}${tried.includes(p.id)?' (tried already)':''}`
  }));
}

/* ---- actions ---- */
['job-from-request','job-dispatch','job-accept','job-decline','job-escalate','job-resend','job-start','job-complete','job-cancel','add-budget-line','remove-budget-line','log-expense','remove-expense'].forEach(a=>{
  WRITE_ACTIONS.add(a);
  ACTION_ENTITY[a] = a.startsWith('job-') ? 'jobs' : 'budgets';
});
function jobSaved(j, label){ touch(j); persist('jobs'); logActivity('updated','jobs',`${j.summary} → ${label||j.status}`); render(); }
function dhOpsAction(action, el){
  const id = el.dataset.id;
  const J = () => state.data.jobs.find(x=>x.id===id);
  const B = () => state.data.budgets.find(x=>x.id===id);
  if(action==='job-from-request'){
    const r = state.data.requests.find(x=>x.id===id); if(!r) return true;
    const ex = state.data.jobs.find(j=>j.requestId===r.id && j.status!=='cancelled');
    if(ex){ state.modal = {type:'job', id:ex.id}; renderModal(); return true; }
    const now = new Date().toISOString();
    const j = {id:uid('job'), summary:r.summary, category:guessCategory(r), member:r.member, memberNo:r.memberNo, details:r.details||'', location:'—', neededBy:'', providerId:'', providerName:'', cost:0, price:0, budgetId:'', budgetName:'', priority:r.priority||'normal', status:'new', requestId:r.id, createdAt:now, updatedAt:now, history:[]};
    jobLog(j, 'Created from member request');
    state.data.jobs.push(j); persist('jobs'); logActivity('added','jobs',j.summary);
    if(r.status==='new'){ r.status='in progress'; touch(r); persist('requests'); }
    toast('Service job created. Pick a provider.'); state.modal = {type:'job', id:j.id}; render(); return true;
  }
  if(['job-dispatch','job-accept','job-decline','job-escalate','job-resend','job-start','job-complete','job-cancel'].includes(action)){
    const j = J(); if(!j) return true; const p = provById(j.providerId);
    if(action==='job-dispatch'){
      const np = provById(document.getElementById('job-provider') && document.getElementById('job-provider').value);
      if(!np){ toast('Choose a provider.'); return true; }
      const w = leadWarning(j, np); if(w) toast(w);
      dispatchJob(j, np); jobSaved(j); return true;
    }
    if(action==='job-accept'){ j.status='accepted'; j.respondedAt=new Date().toISOString(); jobLog(j, `${j.providerName} accepted`); jobSaved(j); return true; }
    if(action==='job-decline'){ escalateJob(j, `${j.providerName} declined`); jobSaved(j); return true; }
    if(action==='job-escalate'){ escalateJob(j, `${j.providerName} did not reply`); jobSaved(j); return true; }
    if(action==='job-resend'){ if(p){ j.responseDueAt = new Date(Date.now()+(p.responseHours||4)*3600000).toISOString(); jobLog(j, `Offer re-sent to ${p.name}`); jobSaved(j,'re-sent'); deliverOffer(j,p); } return true; }
    if(action==='job-start'){ j.status='in progress'; jobLog(j, 'Work started'); jobSaved(j); return true; }
    if(action==='job-complete'){
      const f = document.getElementById('job-final-cost'); if(f && f.value!=='') j.cost = Number(f.value)||0;
      j.status='completed'; j.completedAt=new Date().toISOString(); jobLog(j, `Completed — cost ${money(j.cost)}`); toast('Job completed.'); jobSaved(j); return true;
    }
    if(action==='job-cancel'){ j.status='cancelled'; jobLog(j, 'Cancelled'); state.modal=null; jobSaved(j); return true; }
  }
  if(action==='add-budget-line'){
    const b = B(); if(!b) return true;
    const planned = Number(document.getElementById('bl-planned').value)||0;
    if(!planned){ toast('Enter the planned amount.'); return true; }
    (b.lines = b.lines||[]).push({id:uid('bl'), category:document.getElementById('bl-cat').value, description:document.getElementById('bl-desc').value.trim(), planned});
    touch(b); persist('budgets'); logActivity('updated','budgets',`${b.name}: line added`); render(); return true;
  }
  if(action==='remove-budget-line'){
    const b = B(); if(!b) return true; const lid = el.dataset.line;
    b.lines = (b.lines||[]).filter(l=>l.id!==lid); b.expenses = (b.expenses||[]).filter(e=>e.lineId!==lid);
    touch(b); persist('budgets'); render(); return true;
  }
  if(action==='log-expense'){
    const b = B(); if(!b) return true;

  }
  if(action==='remove-expense'){
    const b = B(); if(!b) return true;

computeInsights = function(){
  const a = _computeInsights();
  (state.data.jobs||[]).forEach(j=>{
    const p = provById(j.providerId);
    if(['declined','expired'].includes(j.status)) a.unshift({level:'bad', text:`Needs a new provider: ${j.summary}${j.member?' ('+j.member+')':''}`, view:'jobs'});
    else if(j.status==='offered' && j.responseDueAt && new Date(j.responseDueAt).getTime()-Date.now() < 30*60000) a.push({level:'warn', text:`Waiting on ${j.providerName} to reply: ${j.summary}`, view:'jobs'});
    else if(['new','offered'].includes(j.status) && p && leadWarning(j,p)) a.push({level:'warn', text:`Short notice for ${p.name}: ${j.summary}`, view:'jobs'});
  });
  (state.data.tickets||[]).filter(o=>o.status==='review').forEach(o=>{ const ev=(state.data.events||[]).find(x=>x.id===o.eventId); a.unshift({level:'bad', text:`Ticket order needs review: ${o.name||'guest'} (${o.qty} for ${ev?ev.name:'an event'})`, view:'events'}); });
  if(canSeeDues()){
    const late=(state.data.members||[]).filter(m=>duesInfo(m).state==='pastdue');
    if(late.length){ const tot=late.reduce((t,m)=>t+duesInfo(m).balance,0); a.push({level:'warn', text:`${late.length} member${late.length>1?'s are':' is'} past due on dues (${money(tot)})`, view:'members'}); }
  }
  (state.data.providers||[]).forEach(p=>{
    (p.docs||[]).forEach(d=>{ const n=docDays(d); if(n===null||n>30) return;
      a.push({level:n<0?'bad':'warn', text:`${p.name}: ${d.type} ${n<0?'expired '+(-n)+' day'+(n===-1?'':'s')+' ago':n===0?'expires today':'expires in '+n+' day'+(n===1?'':'s')}`, view:'providers'}); });
  });
  (state.data.budgets||[]).forEach(b=>{
    if(b.status==='closed') return; const s = budgetSpend(b); if(!s.cap) return; const pct = s.spent/s.cap;
    if(pct>1) a.unshift({level:'bad', text:`${b.name} is over budget (${money(s.spent)} of ${money(s.cap)})`, view:'budgets'});
    else if(pct>=0.85) a.push({level:'warn', text:`${b.name} is ${Math.round(pct*100)}% spent`, view:'budgets'});
  });
  return a;
};

/* ---- inventory helpers ---- */
function invState(i){ const n=Number(i.onHand)||0; if(n<=0) return 'out'; if(n<=(Number(i.reorderAt)||0)) return 'low'; return 'ok'; }
function invExpiring(i){ if(!i.expires) return false; const d=(new Date(i.expires+'T23:59:59').getTime()-Date.now())/86400000; return d<=7; }
function invReorderQty(i){ return invState(i)==='ok' ? 0 : Math.max(0,(Number(i.par)||0)-(Number(i.onHand)||0)); }
function invReorderCost(i){ return invReorderQty(i)*(Number(i.unitCost)||0); }

/* ---- staffing helpers ---- */
function staffById(id){ return (state.data.roster||[]).find(r=>r.id===id); }
function staffByName(n){ return (state.data.roster||[]).find(r=>r.name===n); }
function shiftHours(sh){ const s=timeVal(sh.start), e0=timeVal(sh.end); const e=e0<=s?e0+1440:e0; return Math.round((e-s)/60*100)/100; }
function shiftCost(sh){ const p=staffById(sh.staffId); return shiftHours(sh)*(p?Number(p.rate)||0:0); }
function staffWeekHours(id){ const w=weekBounds(); return (state.data.shifts||[]).filter(sh=>sh.staffId===id && sh.status!=='cancelled' && sh.date>=w.start && sh.date<=w.end).reduce((t,sh)=>t+shiftHours(sh),0); }
function shiftsToday(){ const t=localISO(new Date()); return (state.data.shifts||[]).filter(sh=>sh.date===t && sh.status!=='cancelled'); }

function dhHouseAction(action, el){
  const id = el.dataset.id;
  if(action==='open-house'){ state.modal={type:'house', id}; renderModal(); return true; }
  if(action==='open-stock'){ state.modal={type:'stock', id}; renderModal(); return true; }
  if(action==='open-reorder'){ state.modal={type:'reorder'}; renderModal(); return true; }
  if(action==='export-reorder'){
    const rows=[['House','Item','Supplier','Unit','On hand','Par','Order qty','Unit cost','Est. cost']].concat(reorderLines().map(i=>[i.location,i.name,i.supplier||'',i.unit||'',i.onHand||0,i.par||0,invReorderQty(i),i.unitCost||0,invReorderCost(i)]));
    downloadText('reorder-list.csv', rows.map(r=>r.map(csvEscape).join(',')).join('\n')); return true;
  }
  if(action==='nav-search'){ state.search[el.dataset.view]=el.dataset.q||''; state.view=el.dataset.view; state.modal=null; render(); return true; }
  if(action==='stock-apply'){
    const i=state.data.inventory.find(x=>x.id===id); if(!i) return true;
    const setv=document.getElementById('st-set').value, inn=Number(document.getElementById('st-in').value)||0, out=Number(document.getElementById('st-out').value)||0;
    if(setv!==''){ i.onHand=Math.max(0,Number(setv)||0); i.lastCounted=localISO(new Date()); }
    else if(inn||out){ i.onHand=Math.max(0,(Number(i.onHand)||0)+inn-out); }
    else { toast('Enter an amount received, used, or a counted total.'); return true; }
    touch(i); persist('inventory'); logActivity('updated','inventory',`${i.name} → ${i.onHand} ${i.unit||''}`); toast('Stock updated.'); state.modal=null; render(); return true;
  }
  if(action==='shift-complete'){
    const sh=state.data.shifts.find(x=>x.id===id); if(!sh) return true;
    sh.status='completed'; touch(sh); persist('shifts'); logActivity('updated','shifts',`${sh.staffName} ${sh.date} → completed`); toast('Shift marked complete.'); render(); return true;
  }
  if(action==='spaces-sync-all'){
    let n=0; (state.data.locations||[]).forEach(l=>{ const add=standardSpaceRecords(l.city, state.data.spaces); state.data.spaces.push(...add); n+=add.length; });
    if(n){ persist('spaces'); logActivity('added','spaces',`${n} standard rooms added across houses`); }
    toast(n?`${n} standard rooms added so every house has the full set.`:'Every house already has the full set.'); render(); return true;
  }
  if(action==='house-add-space' || action==='house-add-wings'){
    const loc=state.data.locations.find(l=>l.id===id); if(!loc) return true;
    const mk=(wing,name,cap)=>({id:uid('space'), name, wing, location:loc.city, capacity:cap, exclusive:true, tags:[], amenities:[], addons:[], rules:'', desc:'', status:'active', updatedAt:new Date().toISOString()});
    if(action==='house-add-wings'){
      const add=standardSpaceRecords(loc.city, state.data.spaces); state.data.spaces.push(...add);
      persist('spaces'); logActivity('added','spaces',`${loc.city}: ${add.length} standard rooms`); toast(add.length?`${add.length} standard rooms added to ${loc.city}.`:`${loc.city} already has every standard room.`); render(); return true;
    }
    const rec=mk(el.dataset.wing, 'New '+el.dataset.wing+' space', 0); state.data.spaces.push(rec); persist('spaces'); logActivity('added','spaces',rec.name);
    state.modal={type:'edit', entity:'spaces', id:rec.id}; render(); return true;
  }
  return false;
}

/* ---- budgets now include staff shifts ---- */
function budgetSpend(b){
  const lines = b.lines||[], exp = b.expenses||[];
  const jobs = (state.data.jobs||[]).filter(j=>j.budgetId===b.id);
  const shifts = (state.data.shifts||[]).filter(sh=>sh.budgetId===b.id);
  const jobsDone = jobs.filter(j=>j.status==='completed').reduce((s,j)=>s+(Number(j.cost)||0),0);
  const laborDone = shifts.filter(sh=>sh.status==='completed').reduce((s,sh)=>s+shiftCost(sh),0);
  const committed = jobs.filter(j=>['offered','accepted','in progress'].includes(j.status)).reduce((s,j)=>s+(Number(j.cost)||0),0)
                  + shifts.filter(sh=>sh.status==='scheduled').reduce((s,sh)=>s+shiftCost(sh),0);
  const expTotal = exp.reduce((s,e)=>s+(Number(e.amount)||0),0);
  const planned = lines.reduce((s,l)=>s+(Number(l.planned)||0),0);
  const cap = Number(b.approved)||planned;
  return {planned, cap, expTotal, jobsDone, laborDone, committed, spent:expTotal+jobsDone+laborDone, jobs, shifts};
}

const REV_CATEGORIES = ['Memberships & Dues','Event Tickets & Sponsorship','Room Bookings & Rentals','Food & Beverage Sales','Souk Commissions','Academy Tuition','Concierge & Provider Services','Other'];
const PERIOD_LABEL = {month:'this month', quarter:'this quarter', all:'all recorded'};

function inPeriod(d, per){
  if(!per || per==='all') return true; if(!d) return false;
  if(per.startsWith('ym:')) return String(d).slice(0,7)===per.slice(3);
  const s=String(d); const dt=new Date(s.length>10 ? s : s+'T12:00:00'); if(isNaN(dt)) return false; const n=new Date();
  if(per==='month') return dt.getFullYear()===n.getFullYear() && dt.getMonth()===n.getMonth();
  if(per==='quarter') return dt.getFullYear()===n.getFullYear() && Math.floor(dt.getMonth()/3)===Math.floor(n.getMonth()/3);
  return true;
}
function sumParts(o){ return Object.values(o).reduce((t,v)=>t+v,0); }
function houseFinancials(city, per){
  const revParts={}, costParts={}; const add=(o,k,v)=>{ if(v) o[k]=(o[k]||0)+v; }; let projected=0;
  (state.data.revenue||[]).filter(r=>r.location===city).forEach(r=>{
    if(r.status==='projected'){ projected+=Number(r.amount)||0; return; }
    if(inPeriod(r.date,per)) add(revParts, r.category||'Other', Number(r.amount)||0);
  });
  (state.data.jobs||[]).filter(j=>j.status==='completed' && j.location===city && Number(j.price)>0 && inPeriod(j.completedAt,per)).forEach(j=>add(revParts,'Concierge & provider services (auto)',Number(j.price)));
  locBudgets(city).forEach(b=>{
    (b.expenses||[]).filter(e=>inPeriod(e.at,per)).forEach(e=>add(costParts,'Budget expenses',Number(e.amount)||0));
    (state.data.jobs||[]).filter(j=>j.budgetId===b.id && j.status==='completed' && inPeriod(j.completedAt,per)).forEach(j=>add(costParts,'Provider services',Number(j.cost)||0));
    (state.data.shifts||[]).filter(sh=>sh.budgetId===b.id && sh.status==='completed' && inPeriod(sh.date,per)).forEach(sh=>add(costParts,'Staff labor',shiftCost(sh)));
  });
  (state.data.jobs||[]).filter(j=>j.status==='completed' && !j.budgetId && j.location===city && inPeriod(j.completedAt,per)).forEach(j=>add(costParts,'Provider services (not on a budget)',Number(j.cost)||0));
  (state.data.shifts||[]).filter(sh=>sh.status==='completed' && !sh.budgetId && sh.location===city && inPeriod(sh.date,per)).forEach(sh=>add(costParts,'Staff labor (not on a budget)',shiftCost(sh)));
  const revenue=sumParts(revParts), cost=sumParts(costParts);
  return {revenue, cost, profit:revenue-cost, margin:revenue?Math.round((revenue-cost)/revenue*100):null, revParts, costParts, projected};
}
function ecosystemNet(per){ const hs=[...cityOptions(),'Ecosystem-wide'].map(h=>houseFinancials(h,per)); const rev=hs.reduce((t,f)=>t+f.revenue,0), cost=hs.reduce((t,f)=>t+f.cost,0); return {rev,cost,net:rev-cost}; }
function eventFinancials(b){
  const rev=(state.data.revenue||[]).filter(r=>r.event && r.event===b.linkedTo && r.status!=='projected').reduce((t,r)=>t+(Number(r.amount)||0),0);
  const s=budgetSpend(b); return {revenue:rev, spent:s.spent, profit:rev-s.spent};
}

function insuranceState(p){
  if(!p.insurance) return 'missing';
  if(p.insuranceExpires){ const d=(new Date(p.insuranceExpires+'T23:59:59').getTime()-Date.now())/86400000; if(d<0) return 'expired'; if(d<=30) return 'expiring'; }
  return 'valid';
}

const DOC_TYPES = ['W-9','Certificate of insurance','Partner agreement','License / credential','Other'];
function docDays(d){ if(!d.expires) return null; return Math.round((new Date(d.expires+'T00:00:00').getTime()-new Date().setHours(0,0,0,0))/86400000); }
function docState(d){ const n=docDays(d); if(n===null) return 'ok'; if(n<0) return 'expired'; if(n<=30) return 'expiring'; return 'ok'; }
function docBadge(d){
  const n=docDays(d), st=docState(d);

  const col = st==='expired'?'var(--bad)':st==='expiring'?'var(--warn)':'var(--good)';
  const txt = st==='expired' ? 'expired '+(-n)+'d ago' : n===0 ? 'expires today' : st==='expiring' ? 'expires in '+n+'d' : 'valid to '+esc(d.expires);
  return `<span class="pill tag" style="color:${col};">${txt}</span>`;
}
function providerDocIssues(p){ return (p.docs||[]).filter(d=>docState(d)!=='ok'); }
function syncDocFlags(p){

function providerScore(p){
  const jobs=(state.data.jobs||[]).filter(j=>j.providerId===p.id||(j.tried||[]).includes(p.id));
  const failed=jobs.filter(j=>(j.tried||[]).includes(p.id)).length;
  const acc=jobs.filter(j=>j.providerId===p.id && ['accepted','in progress','completed'].includes(j.status));
  const offers=acc.length+failed;
  const acceptRate = offers ? acc.length/offers : null;
  const mins=acc.filter(j=>j.respondedAt&&j.offeredAt).map(j=>(new Date(j.respondedAt)-new Date(j.offeredAt))/60000).filter(x=>x>=0);
  const avgMins = mins.length ? mins.reduce((a,b)=>a+b,0)/mins.length : null;
  const done=acc.filter(j=>j.status==='completed');
  const timed=done.filter(j=>j.neededBy&&j.completedAt);
  const onTimeRate = timed.length ? timed.filter(j=>new Date(j.completedAt)<=new Date(j.neededBy)).length/timed.length : null;
  const replyWindow=(p.responseHours||4)*60;
  const speed = avgMins===null ? null : Math.max(0, Math.min(1, 1-avgMins/replyWindow));
  const quality = p.quality ? Number(p.quality)/5 : null;
  const parts=[[acceptRate,.35],[onTimeRate,.25],[speed,.2],[quality,.2]].filter(x=>x[0]!==null);
  const wsum=parts.reduce((a,x)=>a+x[1],0);
  const score = parts.length ? Math.round(100*parts.reduce((a,x)=>a+x[0]*x[1],0)/wsum) : null;
  const enough = offers>=3 || done.length>=2;
  const label = score===null||!enough ? 'New' : score>=85 ? 'Excellent' : score>=70 ? 'Good' : score>=50 ? 'Watch' : 'At risk';
  const color = label==='Excellent'||label==='Good' ? 'var(--good)' : label==='New' ? 'var(--text-faint)' : label==='Watch' ? 'var(--warn)' : 'var(--bad)';
  return {offers, accepted:acc.length, failed, acceptRate, avgMins, done:done.length, onTimeRate, timedCount:timed.length, score, label, color, enough};
}

function dhProviderDocsAction(action, el){
  if(!['doc-upload','doc-delete','doc-open'].includes(action)) return false;
  const p = provById(el.dataset.id); if(!p) return true;
  if(action==='doc-open'){
    const d=(p.docs||[]).find(x=>x.id===el.dataset.doc); if(!d) return true;
    const win = window.open('', '_blank');
    DH_DB.docUrl(d.path).then(u=>{ if(u && win){ win.location = u; } else { if(win) win.close(); toast('Could not open that document.'); } });
    return true;
  }
  if(!DH_DB.active()){ toast('Connect the database to store documents.'); return true; }
  if(action==='doc-delete'){
    const d=(p.docs||[]).find(x=>x.id===el.dataset.doc); if(!d) return true;
    if(!window.confirm('Remove '+d.type+' ('+d.name+')? The file is deleted.')) return true;
    DH_DB.removeDoc(d.path).then(ok=>{
      if(!ok){ toast('Could not delete the file.'); return; }
      p.docs = p.docs.filter(x=>x.id!==d.id);
      if(!p.docs.some(x=>x.type===d.type)){ if(d.type==='W-9') p.w9=false; if(d.type==='Partner agreement') p.agreement=false; if(d.type==='Certificate of insurance'){ p.insurance=false; p.insuranceExpires=''; } }
      else syncDocFlags(p);
      touch(p); persist('providers'); logActivity('updated','providers',`${p.name}: ${d.type} removed`); render();
    });
    return true;
  }
  const f=document.getElementById('doc-file') && document.getElementById('doc-file').files[0];
  if(!f){ toast('Choose a file first.'); return true; }
  if(f.size>15*1024*1024){ toast('That file is over 15 MB.'); return true; }
  const type=document.getElementById('doc-type').value, expires=document.getElementById('doc-expires').value||'';
  const id=uid('doc'), safe=f.name.replace(/[^\w.\-]+/g,'_').slice(-80), path=p.id+'/'+id+'-'+safe;
  toast('Uploading…');
  DH_DB.uploadDoc(path, f).then(r=>{
    if(!r.ok){ toast('Upload failed: '+r.msg); return; }
    (p.docs=p.docs||[]).push({id, type, name:f.name, path, expires, uploadedAt:new Date().toISOString(), by:state.staffName||'Staff'});
    syncDocFlags(p); touch(p); persist('providers'); logActivity('updated','providers',`${p.name}: ${type} uploaded`); toast('Document saved.'); render();
  });
  return true;
}

function ticketOrders(e){ return (state.data.tickets||[]).filter(o=>o.eventId===e.id && ['paid','review'].includes(o.status)); }
function ticketStats(e){ const os=ticketOrders(e); return {sold:os.reduce((t,o)=>t+(Number(o.qty)||0),0), rev:os.reduce((t,o)=>t+(Number(o.amount)||0),0), inn:os.reduce((t,o)=>t+(Number(o.checkedIn)||0),0), review:os.filter(o=>o.status==='review').length}; }

function dhTicketAction(action, el){
  if(action==='copy-ticket-link'){
    const e=(state.data.events||[]).find(x=>x.id===el.dataset.id); if(!e) return true;
    if(!e.onSale){ toast('Switch on "Sell tickets online" for this event first.'); return true; }

    persist('tickets'); logActivity('added','tickets',`${name} added to the guest list (${qty})`); render(); return true;
  }
  const o=(state.data.tickets||[]).find(x=>x.id===el.dataset.id); if(!o) return true;
  const q=Number(o.qty)||1, c=Number(o.checkedIn)||0;
  if(action==='tk-in') o.checkedIn=Math.min(q,c+1);
  else if(action==='tk-out') o.checkedIn=Math.max(0,c-1);

  else if(action==='tk-approve') o.status='paid';
  else if(action==='tk-refund'){ if(!window.confirm('Mark this order refunded? Refund the card in Stripe separately; this only updates the door list and revenue.')) return true; o.status='refunded'; }
  touch(o); persist('tickets'); if(['tk-in','tk-all'].includes(action)) logActivity('updated','tickets',`${o.name} checked in (${o.checkedIn}/${q})`); render(); return true;
}

const DUES_GRACE_DAY = 10;
const PAY_METHODS = ['Card','Bank transfer','Check','Cash','Other'];
function canSeeDues(){ const r=curRole().reads; return r==='*' || r.includes('dues'); }
function memberDues(m){ return Number(m.monthlyDues)||DEFAULT_DUES[m.tier]||0; }
function ymOf(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
function ymAdd(ym,n){ const a=ym.split('-').map(Number); return ymOf(new Date(a[0],a[1]-1+n,1)); }
function ymLabel(ym){ const a=ym.split('-').map(Number); return new Date(a[0],a[1]-1,1).toLocaleDateString([], {month:'short',year:'numeric'}); }
function ymDiff(a,b){ const x=a.split('-').map(Number), y=b.split('-').map(Number); return (y[0]-x[0])*12+y[1]-x[1]; }
function duesRec(m){ return (state.data.dues||[]).find(r=>r.memberId===m.id)||null; }
function duesInfo(m){
  const amt=memberDues(m);
  if(m.status!=='active') return {state:'inactive'};
  if(m.duesMode==='comped') return {state:'comped'};
  if(m.duesMode==='paused') return {state:'paused'};
  if(!amt) return {state:'none'};
  const rec=duesRec(m)||{}; const paidTotal=(rec.payments||[]).reduce((t,x)=>t+(Number(x.amount)||0),0);
  if(!rec.billingStart) return {state:'untracked', amt, paidTotal};
  const today=new Date(), cur=ymOf(today);
  const n=Math.max(0, ymDiff(rec.billingStart,cur)+1);
  const dueMonths = today.getDate()>DUES_GRACE_DAY ? n : Math.max(0,n-1);
  const balance = dueMonths*amt-paidTotal;
  const covered=Math.floor((paidTotal+0.5)/amt);
  const st = balance>0.5 ? 'pastdue' : (covered>=n ? 'paid' : 'current');
  return {state:st, amt, paidTotal, balance:Math.max(0,balance), monthsBehind:Math.ceil(Math.max(0,balance)/amt), paidThrough:covered>0?ymAdd(rec.billingStart,covered-1):null, nextDue:ymAdd(rec.billingStart,covered), billedMonths:n};
}
function duesEnsure(m){ let r=duesRec(m); if(!r){ r={id:'due-'+m.id, memberId:m.id, billingStart:'', payments:[]}; (state.data.dues=state.data.dues||[]).push(r); } return r; }
function duesCell(m){
  const d=duesInfo(m), dim='<span style="color:var(--text-faint);">';
  if(d.state==='pastdue') return `<span style="color:var(--bad);">Past due ${money(d.balance)}</span><div class="rowsub">${d.monthsBehind} mo behind</div>`;
  if(d.state==='paid') return `<span style="color:var(--good);">Paid up</span><div class="rowsub">through ${ymLabel(d.paidThrough)}</div>`;
  if(d.state==='current') return `<span style="color:var(--warn);">Due now</span><div class="rowsub">${ymLabel(d.nextDue)} · ${money(d.amt)}</div>`;
  if(d.state==='untracked') return `${dim}Not tracking</span><div class="rowsub">${money(d.amt)}/mo</div>`;
  if(d.state==='comped') return 'Comped'; if(d.state==='paused') return 'Paused'; if(d.state==='none') return `${dim}No dues set</span>`;
  return `${dim}—</span>`;
}
function memberMatch(rec, m){ return (rec.memberNo && m.memberNo && rec.memberNo===m.memberNo) || (rec.member && rec.member===m.name); }
function memberModalHTML(){

  }

  const acts=[
    ...(state.data.requests||[]).filter(r=>memberMatch(r,m)).map(r=>({at:r.createdAt, t:`Request: ${r.summary}`, s:r.status})),
    ...(state.data.bookings||[]).filter(r=>memberMatch(r,m)&&r.status!=='cancelled').map(r=>({at:r.createdAt||r.date, t:`Room: ${r.spaceName||''} on ${r.date||''}`, s:r.status})),

function monthsIn(joined, per){
  if(per.startsWith('ym:')) return (!joined || String(joined).slice(0,7)<=per.slice(3)) ? 1 : 0;
  const n=new Date(); let s=null;
  if(per==='month') s=new Date(n.getFullYear(),n.getMonth(),1);
  else if(per==='quarter') s=new Date(n.getFullYear(),Math.floor(n.getMonth()/3)*3,1);
  const j=joined?new Date(joined+'T12:00:00'):null; const jj=j&&!isNaN(j)?new Date(j.getFullYear(),j.getMonth(),1):null;
  if(jj && (!s||jj>s)) s=jj; if(!s) return 1;
  return Math.max(0,(n.getFullYear()-s.getFullYear())*12+n.getMonth()-s.getMonth()+1);
}
function ticketAuto(e, manual){
  const price=Number(e.ticketPrice)||0, held=Number(e.held)||0; if(!price||!held) return null;
  if((manual||state.data.revenue||[]).some(r=>r.mode==='replace' && r.event===e.name && r.category==='Event Tickets')) return null;
  return {amount:price*held, past:String(e.date)<=localISO(new Date()), seats:held, price};
}
/* Revenue computed from records: dues from members, tickets from events. Manual entries marked "replace" switch the matching automatic line off. */
function autoRevenue(city, per){
  const out=[], manual=state.data.revenue||[];
  const replaceDues=manual.some(r=>r.mode==='replace' && r.location===city && r.category==='Memberships & Dues' && inPeriod(r.date,per));
  if(!replaceDues) (state.data.members||[]).filter(m=>m.house===city && m.status==='active').forEach(m=>{
    const d=Number(m.monthlyDues)||DEFAULT_DUES[m.tier]||0, n=monthsIn(m.joined,per);
    if(d&&n) out.push({name:`${m.name} · dues (${n} mo × ${money(d)})`, category:'Memberships & Dues', amount:d*n, source:'Member record'});
  });
  (state.data.events||[]).filter(e=>e.location===city).forEach(e=>{
    const ords=(state.data.tickets||[]).filter(o=>o.eventId===e.id && o.status==='paid'), realRev=ords.reduce((t,o)=>t+(Number(o.amount)||0),0);
    if(realRev>0 && !manual.some(r=>r.mode==='replace' && r.event===e.name && r.category==='Event Tickets')){
      const rpast=String(e.date)<=localISO(new Date()), nT=ords.reduce((t,o)=>t+(Number(o.qty)||0),0), line={name:`${e.name} · ${nT} ticket${nT===1?'':'s'} sold`, category:'Event Tickets', amount:realRev, source:'Ticket orders', event:e.name};
      if(!rpast) out.push(Object.assign(line,{projected:true})); else if(inPeriod(e.date,per)) out.push(line);
    }
    const t=ticketAuto(e,manual); if(!t) return;
    if(t.past){ if(inPeriod(e.date,per)) out.push({name:`${e.name} · ${t.seats} seat${t.seats===1?"":"s"} × ${money(t.price)}`, category:'Event Tickets', amount:t.amount, source:'Event ticketing', event:e.name}); }
    else out.push({name:`${e.name} · ${t.seats} seat${t.seats===1?"":"s"} held × ${money(t.price)}`, category:'Event Tickets', amount:t.amount, source:'Event ticketing', event:e.name, projected:true});
  });
  return out;
}
/* replaces the version in the earlier block: manual + automatic revenue, with costs */
function houseFinancials(city, per){
  const revParts={}, costParts={}; let projected=0, autoTotal=0, manualTotal=0; const add=(o,k,v)=>{ if(v) o[k]=(o[k]||0)+v; };
  (state.data.revenue||[]).filter(r=>r.location===city).forEach(r=>{
    if(r.status==='projected'){ projected+=Number(r.amount)||0; return; }
    if(inPeriod(r.date,per)){ const a=Number(r.amount)||0; add(revParts,(r.category||'Other')+' · entered',a); manualTotal+=a; }
  });
  autoRevenue(city,per).forEach(a=>{ if(a.projected){ projected+=a.amount; return; } add(revParts,a.category+' · automatic',a.amount); autoTotal+=a.amount; });
  (state.data.jobs||[]).filter(j=>j.status==='completed' && j.location===city && Number(j.price)>0 && inPeriod(j.completedAt,per)).forEach(j=>{ add(revParts,'Concierge & provider services · automatic',Number(j.price)); autoTotal+=Number(j.price); });
  locBudgets(city).forEach(b=>{
    (b.expenses||[]).filter(e=>inPeriod(e.at,per)).forEach(e=>add(costParts,'Budget expenses',Number(e.amount)||0));
    (state.data.jobs||[]).filter(j=>j.budgetId===b.id && j.status==='completed' && inPeriod(j.completedAt,per)).forEach(j=>add(costParts,'Provider services',Number(j.cost)||0));
    (state.data.shifts||[]).filter(sh=>sh.budgetId===b.id && sh.status==='completed' && inPeriod(sh.date,per)).forEach(sh=>add(costParts,'Staff labor',shiftCost(sh)));
  });
  (state.data.jobs||[]).filter(j=>j.status==='completed' && !j.budgetId && j.location===city && inPeriod(j.completedAt,per)).forEach(j=>add(costParts,'Provider services (not on a budget)',Number(j.cost)||0));
  (state.data.shifts||[]).filter(sh=>sh.status==='completed' && !sh.budgetId && sh.location===city && inPeriod(sh.date,per)).forEach(sh=>add(costParts,'Staff labor (not on a budget)',shiftCost(sh)));
  const revenue=sumParts(revParts), cost=sumParts(costParts);
  return {revenue, cost, profit:revenue-cost, margin:revenue?Math.round((revenue-cost)/revenue*100):null, revParts, costParts, projected, autoTotal, manualTotal};
}
function eventFinancials(b){
  const man=(state.data.revenue||[]).filter(r=>r.event && r.event===b.linkedTo && r.status!=='projected').reduce((t,r)=>t+(Number(r.amount)||0),0);
  const ev=(state.data.events||[]).find(e=>e.name===b.linkedTo); const t=ev&&ticketAuto(ev); const auto=t&&t.past?t.amount:0;
  const s=budgetSpend(b); return {revenue:man+auto, auto, manual:man, spent:s.spent, profit:man+auto-s.spent};
}

function timeAgo(iso){
  const diff = Date.now() - new Date(iso).getTime();
  const mins = Math.floor(diff/60000);
  if(mins < 1) return 'just now';
  if(mins < 60) return mins+'m ago';
  const hrs = Math.floor(mins/60);
  if(hrs < 24) return hrs+'h ago';
  return Math.floor(hrs/24)+'d ago';
}

function waitForStorage(timeoutMs){
  return new Promise((resolve)=>{
    const start = Date.now();
    (function check(){
      if(typeof window.storage !== 'undefined' && window.storage && typeof window.storage.get==='function'){ resolve(true); return; }
      if(Date.now()-start > timeoutMs){ resolve(false); return; }
      setTimeout(check, 30);
    })();
  });
}

async function boot(){
  const storageReady = await waitForStorage(4000);
  state.storageAvailable = storageReady;
  if(!storageReady){
    console.warn('window.storage did not become available — running in-memory only, nothing will persist.');
  }
  if(authMode() && DH_DB.profile){ // know who is signed in before touching data, so no role ever seeds data it cannot see
    state.realRole = ROLES[DH_DB.profile.role] ? DH_DB.profile.role : 'auditor';
    state.role = state.realRole;
    state.staffName = DH_DB.profile.display_name;
  }
  // Reads can happen concurrently — they're safe and read-only.
  const reads = await Promise.all(ENTITY_ORDER.map(async(entity)=>{
    const data = await storageGet(STORAGE_KEYS[entity]);
    return [entity, data];
  }));
  // Any first-run seeding writes happen one at a time, to avoid bursting the storage backend
  // with simultaneous first-time writes (which is more likely to trigger transient failures).
  for(const [entity, data] of reads){
    if(data){ state.data[entity] = data; continue; }
    if(entity==='tickets'){ state.data.tickets = []; continue; } // orders are written by the payment webhook; never seeded or reset
    if(entity==='rsvps'){ state.data.rsvps = []; continue; } // left unwritten so the member app can publish its first RSVPs
    if(authMode() && state.realRole!=='ceo'){ state.data[entity] = []; continue; } // nothing visible to this role; never seed on their behalf
    state.data[entity] = SEED[entity];
    await storageSet(STORAGE_KEYS[entity], SEED[entity]);
  }
  state.activity = (await storageGet(ACTIVITY_KEY)) || [];
  if(authMode() && DH_DB.profile){
    if(state.realRole==='ceo') state.team = await DH_DB.team();
  } else {
    state.staffName = await storageGet(STAFF_NAME_KEY, false);
    const savedRole = await storageGet(STAFF_ROLE_KEY, false);
    if(savedRole && ROLES[savedRole]) state.role = savedRole;
    state.realRole = state.role;
  }
  if(!canView(state.view)) state.view = firstView();
  state.loaded = true;
  state.lastSync = new Date();
  document.getElementById('boot-screen')?.remove();
  render();
  if(!storageReady){ toast("Couldn't connect to shared storage — working in-memory only, nothing will save."); }
  if(!state.staffName && !authMode()){ state.modal = {type:'staff-name', first:true}; renderModal(); }
}

async function persist(entity){
  state.lastSync = new Date();
  state.lastLocalWrite = Date.now();
  if(SHARED_ENTITIES.includes(entity)){
    // members write to these lists from their app: fold in new records, and take theirs where they changed later than ours
    const fresh = (await storageGet(STORAGE_KEYS[entity])) || [];
    const stamp = r => String(r.updatedAt || r.createdAt || '');
    fresh.forEach(f=>{
      if(state.deletedIds.has(f.id)) return;
      const i = state.data[entity].findIndex(r=>r.id===f.id);
      if(i===-1) state.data[entity].push(f);
      else if(stamp(f) > stamp(state.data[entity][i])) state.data[entity][i] = f;
    });
  }
  await storageSet(STORAGE_KEYS[entity], state.data[entity]);
  state.lastLocalWrite = Date.now();
  renderSyncStatus();
}

function renderSchedule(){
  const today = new Date().toISOString().slice(0,10);
  const hideWho = state.role==='housekeeping';
  const items = [];
  (state.data.bookings||[]).filter(b=>['confirmed','blocked'].includes(b.status) && String(b.date||'')>=today).forEach(b=>{
    const bits = [];
    if(!hideWho) bits.push(b.status==='blocked' ? 'House hold' : (b.member||''));
    if(b.addons && b.addons.length) bits.push('Add-ons: '+b.addons.join(', '));
    if(b.notes) bits.push(b.notes);
    items.push({date:b.date, time:b.time, kind:'Room', title:b.spaceName||b.spaceId||'Room', sub:bits.filter(Boolean).join(' · ')});
  });
  (state.data.events||[]).filter(e=>e.status!=='cancelled' && String(e.date||'')>=today).forEach(e=>{
    items.push({date:e.date, time:e.time, kind:'Event', title:e.name, sub:[e.room, e.capacity?(e.capacity+' seats'):'', e.dress?('Dress: '+e.dress):''].filter(Boolean).join(' · ')});
  });
  items.sort((a,b)=> String(a.date).localeCompare(String(b.date)) || timeVal(a.time)-timeVal(b.time));
  if(!items.length) return `<div class="empty"><h3>Nothing scheduled</h3><p>No rooms or events from today onward.</p></div>`;
  const byDate = {}; items.slice(0,60).forEach(i=>{ (byDate[i.date] = byDate[i.date] || []).push(i); });
  return Object.entries(byDate).map(([date, list])=>`
    <div class="panel" style="margin-bottom:14px;">
      <div class="panel-head">${esc(new Date(date+'T12:00:00').toLocaleDateString([], {weekday:'long', month:'long', day:'numeric'}))}</div>
      ${list.map(i=>`<div class="activity-row"><span class="who" style="min-width:74px;">${esc(i.time||'')}</span><span style="flex:1;min-width:0;"><span style="color:var(--text);">${esc(i.title)}</span> <span class="pill" style="font-size:10px;">${i.kind}</span>${i.sub?`<br><span style="color:var(--text-faint);font-size:11.5px;">${esc(i.sub)}</span>`:''}</span></div>`).join('')}
    </div>`).join('');
}

function computeInsights(){
  const d = state.data;
  const alerts = [];
  d.vendors.forEach(v=>{
    (v.products||[]).forEach(p=>{
      if(availStock(p) <= 2){
        alerts.push({level: availStock(p)===0?'bad':'warn', text:`${p.name} (${v.name}): ${availStock(p)} available after ${reservedQty(p.id)} reserved`, view:'vendors'});
      }
    });
  });
  d.classes.forEach(c=>{
    if((c.capacity||0) > 0 && classTaken(c) >= c.capacity){
      alerts.push({level:'warn', text:`${c.name} is at capacity (${classTaken(c)}/${c.capacity})`, view:'classes'});
    }
  });
  d.tables.forEach(t=>{
    if((t.capacity||0) > 0 && (t.joined||0) >= t.capacity){
      alerts.push({level:'warn', text:`${t.language} table is full (${t.joined}/${t.capacity})`, view:'tables'});
    }
  });
  d.requests.filter(r=>r.status==='new').forEach(r=>{
    const hrs = r.createdAt ? (Date.now()-new Date(r.createdAt).getTime())/3600000 : 0;
    if(r.priority==='urgent') alerts.push({level:'bad', text:`Urgent request from ${r.member||'a member'} is unclaimed: ${r.summary}`, view:'requests'});
    else if(hrs>=24) alerts.push({level:'warn', text:`${r.summary} (${r.member||'member'}) has waited ${Math.floor(hrs)}h with no owner`, view:'requests'});
  });
  d.applications.filter(a=>a.status==='decision').forEach(a=>{
    alerts.push({level:'warn', text:`${a.name} is awaiting a membership decision`, view:'applications'});
  });
  d.applications.filter(a=>a.status==='applied').forEach(a=>{
    const days = appWaitDays(a);
    if(days!=null && days>=7) alerts.push({level:'warn', text:`${a.name} has waited ${days} days for a first review`, view:'applications'});
  });
  const todayIso = new Date().toISOString().slice(0,10);
  const seen = {};
  d.bookings.filter(b=>['confirmed','blocked'].includes(b.status)).forEach(b=>{
    const sp = d.spaces.find(s=>s.id===b.spaceId);
    if(!sp || !sp.exclusive) return;
    const k = b.spaceId+'|'+b.date+'|'+b.time;
    (seen[k] = seen[k] || []).push(b);
  });
  Object.values(seen).filter(a=>a.length>1).forEach(a=>{
    alerts.push({level:'bad', text:`Double booking: ${a[0].spaceName} at ${a[0].time} on ${a[0].date} (${a.map(x=>x.member||'unknown').join(' and ')})`, view:'bookings'});
  });
  d.events.filter(e=>e.status!=='cancelled').forEach(e=>{
    const s = eventRsvpStats(e.id);
    if(s.waitlist>0) alerts.push({level:'warn', text:`${s.waitlist} on the waitlist for ${e.name}`, view:'events'});
  });
  d.circles.filter(c=>c.status!=='paused').forEach(c=>{
    if(!c.nextDate) alerts.push({level:'warn', text:`${c.name} has no next gathering scheduled`, view:'circles'});
    else if(c.nextDate < todayIso) alerts.push({level:'warn', text:`${c.name} next date (${c.nextDate}) has passed`, view:'circles'});
    if((c.capacity||0)>0 && (c.joined||0) > c.capacity) alerts.push({level:'bad', text:`${c.name} is over capacity (${c.joined}/${c.capacity})`, view:'circles'});
  });
  d.members.filter(m=>m.status==='flagged').forEach(m=>{
    alerts.push({level:'bad', text:`${m.name} is flagged for review`, view:'members'});
  });
  d.spaces.filter(s=>s.status==='maintenance').forEach(s=>{
    alerts.push({level:'warn', text:`${s.name} is in maintenance`, view:'spaces'});
  });
  d.events.filter(e=>e.status==='cancelled').forEach(e=>{
    alerts.push({level:'warn', text:`${e.name} is cancelled`, view:'events'});
  });
  return alerts;
}
