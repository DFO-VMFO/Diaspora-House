function renderField(f, record){
  const val = record ? record[f.key] : undefined;
  if(f.type==='text' || f.type==='number' || f.type==='date' || f.type==='datetime-local'){
    return `<div class="field"><label>${esc(f.label)}${f.required?' *':''}</label><input type="${f.type}" id="f-${f.key}" value="${val!=null?esc(val):''}"></div>`;
  }
  if(f.type==='textarea'){
    return `<div class="field"><label>${esc(f.label)}</label><textarea id="f-${f.key}">${val!=null?esc(val):''}</textarea></div>`;
  }
  if(f.type==='tags'){
    const joined = Array.isArray(val) ? val.join(', ') : (val||'');
    return `<div class="field"><label>${esc(f.label)}</label><input type="text" id="f-${f.key}" value="${esc(joined)}"></div>`;
  }
  if(f.type==='select'){
    return `<div class="field"><label>${esc(f.label)}</label><select id="f-${f.key}">${(typeof f.options==='function'?f.options():f.options).map(o=>`<option value="${esc(o)}" ${val===o?'selected':''}>${esc(o)}</option>`).join('')}</select></div>`;
  }
  if(f.type==='checkbox'){
    return `<div class="field checkbox-row"><input type="checkbox" id="f-${f.key}" ${val?'checked':''}><label style="margin:0;text-transform:none;font-size:12.8px;color:var(--text-dim);">${esc(f.label)}</label></div>`;
  }
  return '';
}

function readFormValues(schema){
  const out = {};
  for(const f of schema.fields){
    const el = document.getElementById('f-'+f.key);
    if(!el) continue;
    if(f.type==='number') out[f.key] = el.value===''? 0 : Number(el.value);
    else if(f.type==='checkbox') out[f.key] = el.checked;
    else if(f.type==='tags') out[f.key] = el.value.split(',').map(s=>s.trim()).filter(Boolean);
    else out[f.key] = el.value;
  }
  return out;
}

/* ---------------- Export ---------------- */
function csvEscape(v){
  const s = String(v==null?'':v);
  if(/[",\n]/.test(s)) return '"'+s.replace(/"/g,'""')+'"';
  return s;
}
function exportCSV(entity){
  const schema = SCHEMAS[entity];
  const rows = state.data[entity];
  const cols = schema.fields.filter(f=>f.type!=='textarea'); // keep CSVs readable; long text stays in the console
  const header = ['id', ...cols.map(f=>f.label)];
  const lines = [header.map(csvEscape).join(',')];
  rows.forEach(r=>{
    const line = [r.id, ...cols.map(f=>{
      const v = r[f.key];
      return Array.isArray(v) ? v.join('; ') : v;
    })];
    lines.push(line.map(csvEscape).join(','));
  });
  const blob = new Blob([lines.join('\r\n')], {type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `diaspora-house-${entity}-${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
  toast(`Exported ${schema.plural} as CSV.`);
}

function exportData(){
  const blob = new Blob([JSON.stringify(state.data, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'diaspora-house-ops-export-'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
  toast('Exported full dataset as JSON.');
}

/* ---------------- Event delegation ---------------- */
document.addEventListener('click', (e)=>{
  const el = e.target.closest('[data-action]');
  if(!el) return;
  const action = el.dataset.action;

  if(action==='noop'){ return; }
  if(action.startsWith('db-') || action==='open-db'){
    if(!isOwner() && !['db-signout','db-sendcode','db-verify'].includes(action)){ toast('Only the CEO can change the database.'); return; }
    dbAction(action); return;
  }
  if(WRITE_ACTIONS.has(action)){
    const ent = ACTION_ENTITY[action] || el.dataset.entity;
    if(ent && !canWrite(ent)){ toast(`${curRole().label} can view this but not change it.`); return; }
  }
  if(action==='export-data' && !['ceo','auditor'].includes(state.role)){ toast(`${curRole().label} cannot export all data.`); return; }
  if(action==='open-role'){ state.modal = {type:'role'}; renderModal(); return; }
  if(action==='set-role'){
    if(!ROLES[el.dataset.role]) return;
    if(!canSwitchRole()){ toast('Only the CEO can view the app as another role.'); return; }
    state.role = el.dataset.role; state.modal = null;
    if(!authMode()) storageSet(STAFF_ROLE_KEY, state.role, false);
    if(!canView(state.view)) state.view = firstView();
    render(); toast(`Viewing as ${curRole().label}.`); return;
  }
  if(action==='nav' && !canView(el.dataset.view)){ toast(`${curRole().label} does not have access to that screen.`); return; }
  if(action==='nav'){ state.view = el.dataset.view; state.modal = null; render(); return; }
  if(action==='close-modal'){ state.modal = null; renderModal(); return; }
  if(action==='export-data'){ exportData(); return; }
  if(action==='export-csv'){ exportCSV(el.dataset.entity); return; }

  if(action==='open-staff-name'){ state.modal = {type:'staff-name', first:false}; renderModal(); return; }
  if(action==='save-staff-name'){
    const name = document.getElementById('staff-name-input').value.trim();
    if(!name){ toast('Enter a name to continue.'); return; }
    state.staffName = name;
    storageSet(STAFF_NAME_KEY, name, false);
    state.modal = null;
    render();
    toast(`Signed in as ${name}.`);
    return;
  }

  if(action==='sort'){
    const entity = el.dataset.entity, key = el.dataset.key;
    const cur = state.sort[entity];
    if(cur && cur.key===key){ state.sort[entity] = {key, dir: cur.dir*-1}; }
    else { state.sort[entity] = {key, dir:1}; }
    document.getElementById('view-root').innerHTML = renderTable(entity);
    return;
  }

  if(action==='open-job'){ state.modal = {type:'job', id:el.dataset.id}; renderModal(); return; }
  if(action==='open-budget'){ state.modal = {type:'budget', id:el.dataset.id}; renderModal(); return; }
  if(dhHouseAction(action, el)) return;
  if(dhHouseOverviewAction(action, el)) return;
  if(dhReportAction(action, el)) return;
  if(dhBudgetAction(action, el)) return;
  if(dhFinanceAction(action, el)) return;
  if(dhProviderDocsAction(action, el)) return;
  if(dhMemberAction(action, el)) return;
  if(dhTicketAction(action, el)) return;
  if(dhSeriesAction(action, el)) return;
  if(dhOpsAction(action, el)) return;
  if(action==='open-edit'){
    state.modal = {type:'edit', entity: el.dataset.entity, id: el.dataset.id || null};
    renderModal();
    return;
  }
  if(action==='save-entity'){
    const entity = el.dataset.entity;
    const id = el.dataset.id || null;
    const schema = SCHEMAS[entity];
    const values = readFormValues(schema);
    const missing = schema.fields.filter(f=>f.required && !String(values[f.key]||'').trim());
    if(missing.length){ toast(`${missing[0].label} is required.`); return; }
    if(entity==='reservations'){
      let found = null;
      state.data.vendors.forEach(v=>(v.products||[]).forEach(p=>{ if(v.name+' — '+p.name===values.productLabel) found = {v,p}; }));
      const prevR = id ? state.data.reservations.find(r=>r.id===id) : null;
      if(!found && !prevR){ toast('Choose a product from the list.'); return; }
      if(found){ values.productId = found.p.id; values.productName = found.p.name; values.vendorId = found.v.id; values.vendorName = found.v.name; if(!prevR) values.price = found.p.price; }
      if(!values.qty || values.qty<1) values.qty = 1;
      if(!prevR) values.date = new Date().toISOString().slice(0,10);
      if(found && values.status!=='cancelled'){
        const others = state.data.reservations.filter(r=>r.id!==id && r.productId===values.productId && ['reserved','fulfilled'].includes(r.status)).reduce((s,r)=>s+(r.qty||1),0);
        if(others + values.qty > (found.p.stock||0)){ toast(`Only ${Math.max(0,(found.p.stock||0)-others)} of ${found.p.name} left.`); return; }
      }
    }
    if(entity==='bookings'){
      const sp = state.data.spaces.find(s=>s.name===values.spaceName);
      const prevB = id ? state.data.bookings.find(b=>b.id===id) : null;
      values.spaceId = sp ? sp.id : (prevB ? prevB.spaceId : '');
      if(values.status==='blocked' && !values.member) values.member = 'House hold';
      if(sp && sp.exclusive && ['confirmed','blocked'].includes(values.status)){
        const clash = state.data.bookings.find(b=>b.id!==id && b.spaceId===values.spaceId && b.date===values.date && b.time===values.time && ['confirmed','blocked'].includes(b.status));
        if(clash){ toast(`${values.spaceName} is already ${clash.status==='blocked'?'held':'booked'} at ${values.time} on ${values.date}.`); return; }
      }
    }
    if(entity==='jobs'){
      const pv = values.providerName && values.providerName!=='Unassigned' ? provByName(values.providerName) : null;
      values.providerId = pv?pv.id:''; if(!pv) values.providerName='';
      const bg = values.budgetName && values.budgetName!=='None' ? state.data.budgets.find(x=>x.name===values.budgetName) : null;
      values.budgetId = bg?bg.id:''; if(!bg) values.budgetName='';
      if(pv && values.neededBy){ const w = leadWarning(values, pv); if(w) toast(w); }
    }
    if(entity==='shifts'){
      const sp = staffByName(values.staffName); values.staffId = sp?sp.id:'';
      const bg = values.budgetName && values.budgetName!=='None' ? state.data.budgets.find(x=>x.name===values.budgetName) : null;
      values.budgetId = bg?bg.id:''; if(!bg) values.budgetName='';
      if(sp && values.status!=='cancelled'){
        const s1 = timeVal(values.start), e0 = timeVal(values.end), e1 = e0<=s1 ? e0+1440 : e0;
        const clash = state.data.shifts.find(x=>{ if(x.id===id || x.staffId!==sp.id || x.date!==values.date || x.status==='cancelled') return false; const s2=timeVal(x.start), f0=timeVal(x.end), e2=f0<=s2?f0+1440:f0; return s1<e2 && s2<e1; });
        if(clash){ toast(`${sp.name} already works ${clash.start} – ${clash.end} that day.`); return; }
      }
    }
    if(entity==='providers'){
      const bp = values.backupName && values.backupName!=='None' ? provByName(values.backupName) : null;
      values.backupId = bp?bp.id:''; if(!bp) values.backupName='';
    }
    if(entity==='applications'){
      const prev = id ? state.data[entity].find(r=>r.id===id) : null;

        if(entity==='applications' && prev.status!==values.status){
          merged.history = [...(prev.history||[]), {stage:values.status, by:state.staffName||'Unknown staff', at:new Date().toISOString()}];
        }

      }

    const copy = JSON.parse(JSON.stringify(original));

    if(entity==='applications'){ copy.status='applied'; delete copy.memberId; copy.history=[{stage:'applied', by:state.staffName||'Unknown staff', at:new Date().toISOString()}]; }

  if(action==='cycle-status'){

    const record = state.data[entity].find(r=>r.id===id);
    if(!record) return;

    const curIdx = options.indexOf(record.status);
    record.status = options[(curIdx+1+options.length) % options.length];
    touch(record);
    persist(entity);

  if(action==='claim-request'){

    a.history = [...(a.history||[]), {stage:a.status, by:state.staffName||'Unknown staff', at:new Date().toISOString()}];
    persist('applications');
    logActivity('moved', 'applications', `${a.name} → ${a.status}`);
    render();

  }
  if(action==='admit-application'){

    let tier = a.tierInterest || 'Standard';

    const nums = state.data.members.map(m=>parseInt(String(m.memberNo||'').replace(/\D/g,''),10)).filter(n=>!isNaN(n));
    const next = (nums.length?Math.max(...nums):0)+1;
    const member = {
      id: uid('mem'), name:a.name, memberNo:'DH-'+String(next).padStart(4,'0'), tier, home:a.city||'', base:a.city||'',
      status:'active', joined:new Date().toISOString().slice(0,10), guestPasses: tier==='Founding 50'?3:1, points:0,
      building:a.building||'', need:a.need||'', bring:a.bring||'',
    };
    state.data.members.push(member);
    a.status = 'admitted'; a.memberId = member.id;
    a.history = [...(a.history||[]), {stage:'admitted', by:state.staffName||'Unknown staff', at:new Date().toISOString()}];
    persist('members'); persist('applications');
    logActivity('admitted', 'applications', `${a.name} as ${member.memberNo}`);
    toast(`${a.name} admitted as ${member.memberNo}.${note}`);
    render();
    return;
  }
  if(action==='decline-application'){
    const a = state.data.applications.find(r=>r.id===el.dataset.id);
    if(!a || a.status!=='decision'){ toast('Only applications at the decision stage can be declined.'); return; }
    a.status = 'declined';
    a.history = [...(a.history||[]), {stage:'declined', by:state.staffName||'Unknown staff', at:new Date().toISOString()}];
    persist('applications');
    logActivity('declined', 'applications', a.name);
    toast(`${a.name} declined.`);
    render();
    return;
  }
  if(action==='open-delete'){
    state.modal = {type:'delete-confirm', entity: el.dataset.entity, id: el.dataset.id};
    renderModal();
    return;
  }
  if(action==='confirm-delete'){
    const entity = el.dataset.entity, id = el.dataset.id;
    const record = state.data[entity].find(r=>r.id===id);
    state.data[entity] = state.data[entity].filter(r=>r.id!==id);
    state.deletedIds.add(id);
    state.modal = null;
    persist(entity);
    toast(`${SCHEMAS[entity].label} deleted.`);
    if(record) logActivity('deleted', entity, recordLabel(entity, record));
    render();
    return;
  }
  if(action==='open-products'){
    state.modal = {type:'products', vendorId: el.dataset.id};
    renderModal();
    return;
  }
  if(action==='add-product'){
    const vendor = state.data.vendors.find(v=>v.id===el.dataset.vendor);
    if(!vendor) return;
    const name = document.getElementById('prod-name').value.trim();
    const price = Number(document.getElementById('prod-price').value)||0;

    toast('Product added.');

  if(action==='remove-product'){
    const vendor = state.data.vendors.find(v=>v.id===el.dataset.vendor);
    if(!vendor) return;
    vendor.products = (vendor.products||[]).filter(p=>p.id!==el.dataset.product);
    persist('vendors');
    renderModal();
    toast('Product removed.');
    return;
  }
});

/* Members write requests and circle seats from their app into shared storage; pick those up without a reload. */
async function refreshShared(){
  if(!state.storageAvailable || !state.loaded) return false;
  if(Date.now()-state.lastLocalWrite < 3000) return false;
  let changed = false;
  for(const e of ['requests','circles','bookings','rsvps','reservations','enrollments']){
    const fresh = await storageGet(STORAGE_KEYS[e]);
    if(fresh && JSON.stringify(fresh)!==JSON.stringify(state.data[e])){ state.data[e] = fresh; changed = true; }
  }
  if(changed && !state.modal){
    const a = document.activeElement;
    if(!(a && /INPUT|TEXTAREA|SELECT/.test(a.tagName))) render(); // never re-render under someone who is typing; the next poll catches up
  }
  return changed;
}
setInterval(refreshShared, 15000);

/* ============ Budgets: forecasts and CEO approval ============ */
const BSTATUS = {draft:['applied','Draft'], submitted:['interview','Awaiting approval'], approved:['active','Approved'], rejected:['flagged','Sent back'], closed:['pending','Closed']};
function bStatus(b){ return BSTATUS[b.status] ? b.status : 'draft'; }
function bBadge(b){ const x = BSTATUS[bStatus(b)]; return `<span class="badge ${x[0]}" data-action="open-budget" data-id="${esc(b.id)}" style="cursor:pointer;" title="Open budget">${x[1]}</span>`; }
function bPlanned(b){ return (b.lines||[]).reduce((t,l)=>t+(Number(l.planned)||0),0); }
/* Forecast at completion: every line finishes at the larger of its plan and what is already spent on it,
   plus automatic charges (finished and scheduled provider jobs and staff shifts) which sit outside the lines.
   If the budget has start and end dates, a pace estimate (spent so far / share of time elapsed) is shown too. */
function budgetForecast(b){
  const s = budgetSpend(b); const exp = b.expenses||[];
  const rows = (b.lines||[]).map(l=>{
    const spent = exp.filter(e=>e.lineId===l.id).reduce((t,e)=>t+(Number(e.amount)||0),0);
    const planned = Number(l.planned)||0; const fc = Math.max(planned, spent);
    return {id:l.id, label:l.category+(l.description?' — '+l.description:''), planned, spent, forecast:fc, variance:fc-planned};
  });
  const orphan = exp.filter(e=>!(b.lines||[]).some(l=>l.id===e.lineId)).reduce((t,e)=>t+(Number(e.amount)||0),0);
  const auto = s.jobsDone + s.laborDone + s.committed;
  const total = rows.reduce((t,r)=>t+r.forecast,0) + orphan + auto;
  let pace = null;
  if(b.startDate && b.endDate){
    const t0 = Date.parse(b.startDate), t1 = Date.parse(b.endDate), now = Date.now();
    if(t1>t0 && now>t0 && now<t1){ const frac = (now-t0)/(t1-t0); if(frac>=0.15) pace = {frac, amount: s.spent/frac}; }
  }
  const cap = s.cap; const worst = Math.max(total, pace?pace.amount:0);
  const level = !cap ? '' : (worst>cap ? 'over' : (worst>=cap*0.95 ? 'tight' : 'ok'));
  return {rows, orphan, auto, total, pace, cap, level, worst, over: Math.max(0, worst-cap)};
}
function fcColor(level){ return level==='over'?'var(--bad)':(level==='tight'?'var(--warn)':'var(--good)'); }
function bLogAdd(b, what, extra){ (b.approvalLog = b.approvalLog||[]).push(Object.assign({at:new Date().toISOString(), by:state.staffName||'Staff', what}, extra||{})); if(b.approvalLog.length>30) b.approvalLog = b.approvalLog.slice(-30); }

/* the generic edit form no longer sets the approved total or status: that happens through the approval flow */
SCHEMAS.budgets.fields = SCHEMAS.budgets.fields.filter(f=>f.key!=='approved' && f.key!=='status');
SCHEMAS.budgets.fields.splice(SCHEMAS.budgets.fields.findIndex(f=>f.key==='notes'),0,
  {key:'startDate', label:'Spending starts (optional, enables pace forecast)', type:'date'},
  {key:'endDate', label:'Spending ends (optional)', type:'date'});
(function(){
  const cols = SCHEMAS.budgets.columns; const i = cols.findIndex(c=>c.header==='Status');
  cols[i] = {header:'Status', sortKey:'status', render:b=>bBadge(b)};
  cols.splice(i,0,{header:'Forecast', render:b=>{
    if(bStatus(b)==='submitted') return `${money(b.requested||bPlanned(b))}<div class="rowsub">requested</div>`;
    if(bStatus(b)==='draft'||bStatus(b)==='rejected') return `${money(bPlanned(b))}<div class="rowsub">planned</div>`;
    const f = budgetForecast(b);
    return `<span style="color:${fcColor(f.level)};">${money(f.worst)}</span><div class="rowsub">${f.level==='over'?money(f.over)+' over':(f.level==='tight'?'close to the limit':'on plan')}</div>`;
  }});
  const ap = cols.find(c=>c.header==='Approved'); const apr = ap.render;
  ap.render = b => bStatus(b)==='approved'||bStatus(b)==='closed' ? apr(b) : `<span style="color:var(--text-faint);">not approved</span>`;
})();

  const d = b.decision;

  const log = (b.approvalLog||[]).slice(-5).reverse().map(x=>`<div class="activity-row"><span class="who">${esc(x.by)}</span><span>${esc(x.what)}${x.amount?' · '+money(x.amount):''}${x.note?' · “'+esc(x.note)+'”':''}</span><span class="when">${timeAgo(x.at)}</span></div>`).join('');
  const approval = `<div class="modal-head" style="margin-bottom:6px;"><h3 style="font-size:13px;">Approval</h3>${bBadge(b)}</div>

  const forecast = (st==='approved'||st==='closed'||f.rows.length) ? `<div class="modal-head" style="margin-bottom:6px;"><h3 style="font-size:13px;">Forecast at completion</h3><span class="pill" style="color:${fcColor(f.level)};">${money(f.worst)}${f.cap?' of '+money(f.cap):''}</span></div>

      ${f.rows.map(r=>`<div class="nested-item" style="font-size:12.5px;display:grid;grid-template-columns:1.6fr 1fr 1fr 1fr 1fr;gap:8px;"><span>${esc(r.label)}</span><span>${money(r.planned)}</span><span>${money(r.spent)}</span><span>${money(r.forecast)}</span>${vcell(r.variance)}</div>`).join('')}
      ${f.auto?`<div class="nested-item" style="font-size:12.5px;display:grid;grid-template-columns:1.6fr 1fr 1fr 1fr 1fr;gap:8px;"><span>Provider jobs and staff shifts (automatic)</span><span>—</span><span>—</span><span>${money(f.auto)}</span><span></span></div>`:''}
      ${f.orphan?`<div class="nested-item" style="font-size:12.5px;"><span>Expenses on removed lines: ${money(f.orphan)}</span></div>`:''}
    </div>
    <p style="font-size:11.5px;color:var(--text-faint);margin:0 0 14px;">Each line is assumed to finish at the larger of its plan and what has been spent on it. ${f.pace?`At the current pace (${Math.round(f.pace.frac*100)}% of the time used) spending would reach ${money(f.pace.amount)}.`:'Add start and end dates in Edit to see a pace estimate.'}</p>` : '';
  const marker = '<div class="modal-head" style="margin-bottom:6px;"><h3 style="font-size:13px;">Line items</h3></div>';
  return html.includes(marker) ? html.replace(marker, approval+forecast+marker) : html;
};

function dhBudgetAction(action, el){
  const id = el.dataset.id; const find = ()=>state.data.budgets.find(x=>x.id===id);
  if(action==='add-budget-line' || action==='remove-budget-line'){
    const b = find(); if(b && !isOwner() && ['approved','closed','submitted'].includes(bStatus(b))){
      toast(bStatus(b)==='submitted' ? 'Withdraw this budget from approval to edit its lines.' : 'This budget is approved. Request a change to edit its lines.'); return true; }
    return false;
  }
  if(!action.startsWith('budget-') || !['budget-submit','budget-withdraw','budget-request-change','budget-approve','budget-reject','budget-close','budget-reopen'].includes(action)) return false;
  const b = find(); if(!b) return true;
  const ceoOnly = ['budget-approve','budget-reject','budget-close','budget-reopen'];
  if(ceoOnly.includes(action) && !isOwner()){ toast('Only the CEO can do that.'); return true; }
  const st = bStatus(b); const planned = bPlanned(b); const now = new Date().toISOString();
  const done = (msg)=>{ touch(b); persist('budgets'); logActivity('updated','budgets',`${b.name}: ${msg}`); render(); };
  if(action==='budget-submit'){
    if(!(b.lines||[]).length || !planned){ toast('Add at least one line item with a planned amount first.'); return true; }
    b.status='submitted'; b.requested=planned; b.submittedAt=now; b.submittedBy=state.staffName||'Staff'; b.submittedByEmail=(DH_DB.profile&&DH_DB.profile.email)||'';
    bLogAdd(b,'Submitted for approval',{amount:planned}); done('submitted for approval'); budgetNotify(b,'submitted'); toast('Submitted. The CEO has been asked to approve it.'); return true;
  }

/* ============ Programming Series: the recurring cultural calendar ============
   A series is a rule ("every Wednesday 7 PM", "first Thursday of the month", "every Oct 9").
   "Generate upcoming events" turns each active series into real events for the next few weeks.
   Event ids are built from series + date (+ house), so generating twice never duplicates.
   To skip one night, cancel that event instead of deleting it; a deleted event would come back. */
const SRS_WEEKDAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];

function srsCadenceLabel(s){
  const t = s.time ? ' · '+s.time : '';
  if(s.cadence==='weekly') return 'Every '+(s.weekday||'week')+t;
  if(s.cadence==='every 2 weeks') return 'Every other '+(s.weekday||'week')+t;
  if(s.cadence==='monthly') return (s.weekOfMonth==='last'?'Last':(s.weekOfMonth||'1st'))+' '+(s.weekday||'day')+' of the month'+t;
  if(s.cadence==='annual'){
    const m = String(s.monthDay||'').split('-'); const d = new Date(2026,(parseInt(m[0],10)||1)-1,parseInt(m[1],10)||1);
    return 'Every '+d.toLocaleDateString([], {month:'long', day:'numeric'})+t;
  }
  return '';
}
/* The dates (YYYY-MM-DD) a series lands on between two dates, inclusive. */
function srsDates(s, fromISO, toISO){
  const out = []; const wd = SRS_WEEKDAYS.indexOf(s.weekday);
  const from = new Date(fromISO+'T12:00:00'), to = new Date(toISO+'T12:00:00');
  const lo = s.startDate ? new Date(s.startDate+'T12:00:00') : null, hi = s.endDate ? new Date(s.endDate+'T12:00:00') : null;
  const anchor = new Date((s.startDate||'2026-01-04')+'T12:00:00');
  for(let d = new Date(from); d <= to; d.setDate(d.getDate()+1)){
    if((lo && d<lo) || (hi && d>hi)) continue;
    const iso = localISO(d); let hit = false;
    if(s.cadence==='annual') hit = !!s.monthDay && iso.slice(5)===s.monthDay;
    else if(wd<0 || d.getDay()!==wd) hit = false;
    else if(s.cadence==='weekly') hit = true;
    else if(s.cadence==='every 2 weeks'){ const w = Math.floor(Math.round((d-anchor)/86400000)/7); hit = ((w%2)+2)%2===0; }
    else if(s.cadence==='monthly'){
      const last = new Date(d.getFullYear(), d.getMonth()+1, 0).getDate();
      hit = s.weekOfMonth==='last' ? d.getDate()+7>last : Math.ceil(d.getDate()/7)===(parseInt(s.weekOfMonth,10)||1);
    }
    if(hit) out.push(iso);
  }
  return out;
}

function srsGenerate(){
  const today = localISO(new Date()), evs = state.data.events, have = new Set(evs.map(e=>e.id)); let n = 0;
  state.data.series.filter(s=>s.status!=='paused').forEach(s=>{
    const to = new Date(); to.setDate(to.getDate()+(Number(s.horizonWeeks)||8)*7);
    const themes = String(s.themes||'').split('\n').map(x=>x.trim()).filter(Boolean);
    const base = s.startDate || '2026-01-01';
    srsDates(s, today, localISO(to)).forEach(date=>{
      const ord = srsDates(s, base, date).length-1;
      const theme = themes.length ? themes[((ord%themes.length)+themes.length)%themes.length] : '';
      srsHouses(s).forEach(city=>{
        const id = 'ser-'+s.id+'-'+date+(city?'-'+city.toLowerCase().replace(/[^a-z0-9]+/g,''):'');
        if(have.has(id)) return;
        evs.push(touch(Object.assign({id, name: theme ? `${s.name}: ${theme}` : s.name, date, status:'scheduled', location:city, onSale:false, seriesId:s.id, seriesName:s.name, createdAt:new Date().toISOString()}, srsEventFields(s))));
        have.add(id); n++;

  if(n){ persist('events'); logActivity('added','events',`${n} recurring event${n===1?'':'s'} from Programming Series`); }
  return n;
}

function dhSeriesAction(action, el){
  if(action==='series-starter'){
    const have = new Set(state.data.series.map(s=>s.id)); let added = 0;
    srsStarterList().forEach(s=>{ if(have.has(s.id)) return; state.data.series.push(touch(Object.assign(s,{createdAt:new Date().toISOString()}))); added++; });
    if(added){ persist('series'); logActivity('added','series',`${added} starter series`); }
    const made = srsGenerate();
    toast(added ? `Added ${added} series and ${made} upcoming events.` : (made ? `Series were already loaded. Added ${made} upcoming events.` : 'The starter calendar is already loaded.'));
    render(); return true;
  }
  if(action==='series-generate'){
    const made = srsGenerate();
    toast(made ? `Added ${made} upcoming event${made===1?'':'s'}.` : 'Nothing new to add. The calendar is already up to date.');
    render(); return true;
  }
  if(action==='series-refresh'){
    const s = state.data.series.find(x=>x.id===el.dataset.id); if(!s) return true;
    const today = localISO(new Date()); let n = 0;
    state.data.events.filter(e=>e.seriesId===s.id && e.status!=='cancelled' && String(e.date)>=today).forEach(e=>{ Object.assign(e, srsEventFields(s)); touch(e); n++; });
    if(n){ persist('events'); logActivity('updated','events',`${n} upcoming events from ${s.name}`); }
    toast(n ? `Updated ${n} upcoming event${n===1?'':'s'} (names and cancellations kept).` : 'No upcoming events from this series to update.');
    render(); return true;
  }
  return false;
}

STRIPS.series = function(){
  const today = localISO(new Date()), soon = new Date(); soon.setDate(soon.getDate()+56);
  const active = state.data.series.filter(s=>s.status!=='paused');
  const soonN = (state.data.events||[]).filter(e=>e.seriesId && e.status!=='cancelled' && String(e.date)>=today && String(e.date)<=localISO(soon)).length;
  const btns = canWrite('series') ? `<button class="btn btn-primary btn-sm" data-action="series-generate">Generate upcoming events</button> <button class="btn btn-ghost btn-sm" data-action="series-starter">Load the starter calendar</button>` : '';
  const weekly = active.filter(s=>s.cadence!=='annual');
  const rhythm = SRS_WEEKDAYS.map(d=>{ const list = weekly.filter(s=>s.weekday===d); return list.length ? `<div style="min-width:130px;"><div class="mono" style="font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ochre-2);margin-bottom:4px;">${d.slice(0,3)}</div>${list.map(s=>`<div style="font-size:12.5px;color:var(--text);margin-bottom:3px;">${esc(s.name)}<span style="color:var(--text-faint);"> · ${esc(s.time||'')}${s.cadence==='monthly'?' · '+esc(s.weekOfMonth||'1st'):s.cadence==='every 2 weeks'?' · alt weeks':''}</span></div>`).join('')}</div>` : ''; }).join('');
  return `<div class="panel" style="margin-bottom:16px;padding:16px 18px;">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;">
      <div style="max-width:620px;"><div style="color:var(--text);font-size:13.5px;margin-bottom:4px;">${active.length} active series · ${soonN} event${soonN===1?'':'s'} on the calendar for the next 8 weeks</div>
      <div style="color:var(--text-faint);font-size:12px;">Series are the rhythm of the House. Generating creates the real events members see and RSVP to. To skip one night, cancel that event rather than deleting it. After changing a series, use the refresh arrow on its row to update its upcoming events.</div></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">${btns}</div>
    </div>
    ${rhythm ? `<div style="display:flex;gap:22px;flex-wrap:wrap;margin-top:16px;padding-top:14px;border-top:1px solid var(--line);">${rhythm}</div>` : ''}
  </div>`;
};

async function bootGate(){
  if(authMode()){
    if(DH_DB.session() && !DH_DB.profile) await DH_DB.loadProfile();
    if(!DH_DB.session() || !DH_DB.profile){
      DH_DB.signOutLocal();
      if(await dhOpenSignIn()){ boot(); return; }
      document.getElementById('boot-screen')?.remove();
      state.modal = {type:'login'}; renderModal();
      return;
    }
  }
  boot();
}
DH_DB.onAuthLost = async () => { if(await dhOpenSignIn()){ location.reload(); return; } document.getElementById('boot-screen')?.remove(); state.loaded = false; state.modal = {type:'login'}; renderModal(); };
function dhAfterLogin(){ state.modal = null; renderModal(); boot(); }
bootGate();
