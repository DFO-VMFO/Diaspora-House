<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diaspora House — The Club Brain</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,340;0,9..144,440;0,9..144,560;0,9..144,650;1,9..144,440;1,9..144,560&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --charcoal:#15110D;
  --charcoal-2:#1D1712;
  --charcoal-3:#241C15;
  --midnight:#0C1119;
  --bone:#F4EAD8;
  --bone-dim:#E2D3B4;
  --terracotta:#C1613B;
  --terracotta-2:#E2895A;
  --ochre:#C89A44;
  --ochre-2:#E8C374;
  --brass:#9C7B4F;
  --ink:#F1E7D6;
  --ink-dim:#B9AB90;
  --ink-faint:#8A7E68;
  --line:rgba(var(--tint-rgb),0.10);
  --line-strong:rgba(var(--tint-rgb),0.18);
  --good:#7FA06E;
  --tint-rgb:244,235,218;
  --shadow: 0 20px 50px -20px rgba(0,0,0,0.6);
  --arch: 120px 120px 10px 10px;
  --arch-sm: 60px 60px 8px 8px;
  /* fixed tones — the Black Brass Card keeps the same face in either theme */
  --card-ochre:#C89A44;
  --card-ochre-2:#E8C374;
  --card-ink:#F1E7D6;
  --card-ink-faint:#9C8F76;
  --on-accent:#170F08;
  color-scheme: dark;
}
[data-theme="light"]{
  --charcoal:#F5EBDA;
  --charcoal-2:#FFFCF5;
  --charcoal-3:#EFE1C4;
  --midnight:#141019;
  --bone:#1E1710;
  --bone-dim:#3A2E1E;
  --terracotta:#B15832;
  --terracotta-2:#96431F;
  --ochre:#9C7223;
  --ochre-2:#8A5F1E;
  --brass:#8A6B44;
  --ink:#2A2115;
  --ink-dim:#5B4C36;
  --ink-faint:#8A7A5C;
  --line:rgba(28,20,10,0.10);
  --line-strong:rgba(28,20,10,0.18);
  --good:#3E7A34;
  --tint-rgb:28,20,10;
  --shadow: 0 20px 44px -22px rgba(90,62,30,0.30);
  color-scheme: light;
}
[data-theme="light"] body{
  background:
    radial-gradient(1100px 600px at 12% -10%, rgba(193,97,59,0.10), transparent 60%),
    radial-gradient(900px 500px at 100% 0%, rgba(200,154,68,0.10), transparent 55%),
    var(--charcoal);
}
[data-theme="light"] ::-webkit-scrollbar-thumb{background:var(--line-strong);}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:
    radial-gradient(1100px 600px at 12% -10%, rgba(193,97,59,0.14), transparent 60%),
    radial-gradient(900px 500px at 100% 0%, rgba(200,154,68,0.10), transparent 55%),
    var(--charcoal);
  color:var(--ink);
  font-family:'Inter',sans-serif;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
::selection{background:var(--ochre);color:#15110D;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:8px;}
::-webkit-scrollbar-track{background:transparent;}
a{color:inherit;}
button{font-family:inherit;cursor:pointer;}
h1,h2,h3,h4{font-family:'Fraunces',serif;font-weight:560;margin:0;letter-spacing:-0.01em;}
.eyebrow{
  font-family:'IBM Plex Mono',monospace;
  font-size:11px;
  letter-spacing:0.14em;
  text-transform:uppercase;
  color:var(--ochre-2);
}
.mono{font-family:'IBM Plex Mono',monospace;}
.hairline{height:1px;background:linear-gradient(90deg, var(--ochre) 0%, transparent 70%);opacity:0.55;}
.thread{
  height:1px;
  background:linear-gradient(90deg, transparent, var(--ochre-2), var(--terracotta-2), transparent);
  background-size:200% 100%;
  animation:threadmove 5s linear infinite;
  opacity:0.7;
}
@keyframes threadmove{0%{background-position:0% 0;}100%{background-position:200% 0;}}
@media (prefers-reduced-motion: reduce){ *{animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important;} }

/* ---------- Shell ---------- */
#shell{display:grid;grid-template-columns:250px 1fr;min-height:100vh;}
@media (max-width:920px){#shell{grid-template-columns:1fr;}}

#rail{
  border-right:1px solid var(--line);
  padding:28px 18px 18px;
  display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh;
}
@media (max-width:920px){#rail{display:none;}}

.brandmark{display:flex;align-items:center;gap:12px;padding:0 6px 22px;}
.brandmark .arch-icon{width:34px;height:34px;border:1px solid var(--ochre);border-radius:var(--arch-sm);display:flex;align-items:center;justify-content:center;flex-shrink:0;background:linear-gradient(180deg, rgba(200,154,68,0.14), transparent);}
.brandmark .arch-icon svg{width:16px;height:16px;}
.brandname{font-family:'Fraunces',serif;font-weight:560;font-size:16.5px;line-height:1.15;}
.brandname small{display:block;font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:0.16em;color:var(--ink-faint);text-transform:uppercase;margin-top:3px;}

nav.railnav{display:flex;flex-direction:column;gap:2px;margin-top:6px;}
.navitem{
  display:flex;align-items:center;gap:12px;
  padding:10px 12px;border-radius:10px;
  color:var(--ink-dim);text-decoration:none;
  font-size:14px;font-weight:500;
  border:1px solid transparent;
  background:transparent;
  transition:background .18s ease, color .18s ease, border-color .18s ease;
  width:100%;text-align:left;
}
.navitem svg{width:17px;height:17px;flex-shrink:0;opacity:0.85;}
.navitem:hover{color:var(--ink);background:rgba(var(--tint-rgb),0.04);}
.navitem.active{color:var(--ink);background:linear-gradient(90deg, rgba(193,97,59,0.16), rgba(200,154,68,0.05));border-color:var(--line-strong);}
.navitem.active svg{opacity:1;color:var(--ochre-2);}

.railfoot{margin-top:auto;padding-top:16px;}
.railcard{
  border:1px solid var(--line);border-radius:var(--arch-sm);
  padding:14px 14px 16px;background:rgba(var(--tint-rgb),0.03);
}
.railcard .eyebrow{margin-bottom:6px;}
.railcard p{margin:0;font-size:12.5px;color:var(--ink-dim);line-height:1.5;}

#main{min-width:0;padding-bottom:96px;}
header.topbar{
  position:sticky;top:0;z-index:20;
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 22px;
  background:rgba(21,17,13,0.86);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
}
.topbar .titleblock .eyebrow{margin-bottom:2px;}
.topbar h1{font-size:20px;}
.topbar-actions{display:flex;align-items:center;gap:10px;}
.iconbtn{
  width:38px;height:38px;border-radius:var(--arch-sm);
  border:1px solid var(--line-strong);background:rgba(var(--tint-rgb),0.03);
  display:flex;align-items:center;justify-content:center;color:var(--ink-dim);
  position:relative;
}
.iconbtn svg{width:16px;height:16px;}
.iconbtn:hover{color:var(--ink);border-color:var(--ochre);}
.dot{position:absolute;top:6px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--terracotta-2);box-shadow:0 0 0 2px var(--charcoal);}
.avatarbtn{
  width:38px;height:38px;border-radius:var(--arch-sm);
  background:linear-gradient(160deg, var(--terracotta), var(--ochre));
  border:1px solid var(--ochre-2);
  display:flex;align-items:center;justify-content:center;
  font-family:'Fraunces',serif;font-weight:650;color:var(--on-accent);font-size:15px;
}

main.view{padding:22px;max-width:1180px;}

/* mobile bottom tabs */
#tabbar{display:none;}
@media (max-width:920px){
  #tabbar{
    display:flex;position:fixed;bottom:0;left:0;right:0;z-index:30;
    background:rgba(21,17,13,0.95);backdrop-filter:blur(10px);
    border-top:1px solid var(--line);padding:8px 4px calc(8px + env(safe-area-inset-bottom));
    overflow-x:auto;justify-content:flex-start;
  }
  #tabbar::-webkit-scrollbar{display:none;}
  #tabbar button{
    flex:0 0 auto;min-width:66px;background:none;border:none;color:var(--ink-faint);
    display:flex;flex-direction:column;align-items:center;gap:4px;
    font-size:9.5px;font-family:'IBM Plex Mono',monospace;letter-spacing:0.04em;
    padding:4px 6px;
  }
  #tabbar button svg{width:19px;height:19px;}
  #tabbar button.active{color:var(--ochre-2);}
  main.view{padding:16px 14px 24px;}
  header.topbar{padding:14px 16px;}
}

/* ---------- Generic components ---------- */
.grid{display:grid;gap:16px;}
.g2{grid-template-columns:repeat(2,1fr);}
.g3{grid-template-columns:repeat(3,1fr);}
.g4{grid-template-columns:repeat(4,1fr);}
@media (max-width:920px){.g2,.g3,.g4{grid-template-columns:1fr;}}
@media (min-width:921px) and (max-width:1180px){.g3,.g4{grid-template-columns:repeat(2,1fr);}}

.card{
  border:1px solid var(--line);border-radius:18px;
  background:linear-gradient(180deg, rgba(var(--tint-rgb),0.035), rgba(var(--tint-rgb),0.015));
  padding:20px;position:relative;overflow:hidden;
}
.card.arch{border-radius:var(--arch);}
.card:hover{border-color:var(--line-strong);}
.section{margin-bottom:34px;}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap;}
.section-head h2{font-size:22px;}
.section-head .link{font-size:12.5px;color:var(--ochre-2);text-decoration:none;font-family:'IBM Plex Mono',monospace;letter-spacing:0.03em;background:none;border:none;}
.section-head .link:hover{color:var(--terracotta-2);}
.muted{color:var(--ink-dim);}
.faint{color:var(--ink-faint);}
p{line-height:1.6;}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:11px 18px;border-radius:var(--arch-sm);
  font-size:13.5px;font-weight:600;border:1px solid transparent;
  transition:transform .15s ease, filter .15s ease, background .15s ease;
}
.btn:active{transform:scale(0.98);}
.btn-primary{background:linear-gradient(135deg, var(--terracotta), var(--ochre));color:var(--on-accent);}
.btn-primary:hover{filter:brightness(1.08);}
.btn-ghost{background:transparent;border-color:var(--line-strong);color:var(--ink);}
.btn-ghost:hover{border-color:var(--ochre);color:var(--ochre-2);}
.btn-sm{padding:8px 13px;font-size:12.5px;}
.btn-block{width:100%;}
.btn[disabled]{opacity:0.45;pointer-events:none;}

.pill{
  display:inline-flex;align-items:center;gap:6px;
  padding:5px 11px;border-radius:999px;border:1px solid var(--line-strong);
  font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:0.05em;text-transform:uppercase;
  color:var(--ink-dim);
}
.pill.on{border-color:var(--ochre);color:var(--ochre-2);background:rgba(200,154,68,0.08);}
.pill.tag{color:var(--ink-faint);}

.tag-row{display:flex;flex-wrap:wrap;gap:6px;}

.stat{border:1px solid var(--line);border-radius:16px;padding:16px 18px;background:rgba(var(--tint-rgb),0.02);}
.stat .num{font-family:'Fraunces',serif;font-size:28px;font-weight:560;color:var(--bone);}
.stat .label{font-size:11.5px;color:var(--ink-faint);font-family:'IBM Plex Mono',monospace;letter-spacing:0.06em;text-transform:uppercase;margin-top:4px;}

/* Anticipatory / AI cards */
.pulse-card{
  border:1px solid var(--line-strong);border-radius:var(--arch);
  padding:20px 22px;
  background:linear-gradient(140deg, rgba(193,97,59,0.12), rgba(200,154,68,0.05) 60%, transparent);
  position:relative;
}
.pulse-card .glyph{
  position:absolute;top:16px;right:18px;width:8px;height:8px;border-radius:50%;
  background:var(--ochre-2);box-shadow:0 0 0 4px rgba(200,154,68,0.18);
  animation:pulseglow 2.2s ease-in-out infinite;
}
@keyframes pulseglow{0%,100%{opacity:0.5;}50%{opacity:1;}}
.pulse-card h3{font-size:17.5px;margin-bottom:6px;max-width:88%;}
.pulse-card p{font-size:13.5px;color:var(--ink-dim);margin:0 0 14px;max-width:92%;}
.pulse-card .actions{display:flex;gap:10px;flex-wrap:wrap;}

/* Ticker */
.ticker-wrap{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--midnight);}
.ticker-head{display:flex;align-items:center;justify-content:space-between;padding:9px 14px;border-bottom:1px solid var(--line);}
.ticker-track{display:flex;white-space:nowrap;animation:tickermove 28s linear infinite;padding:11px 0;}
.ticker-wrap:hover .ticker-track{animation-play-state:paused;}
@keyframes tickermove{0%{transform:translateX(0);}100%{transform:translateX(-50%);}}
.ticker-item{display:inline-flex;align-items:center;gap:8px;padding:0 22px;font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-dim);border-right:1px solid var(--line);}
.ticker-item .sym{color:var(--bone);font-weight:500;}
.ticker-item.up{color:var(--good);}
.ticker-item.down{color:var(--terracotta-2);}

/* Space / room cards */
.space-card{border:1px solid var(--line);border-radius:var(--arch);overflow:hidden;display:flex;flex-direction:column;background:rgba(var(--tint-rgb),0.02);}
.space-media{height:118px;position:relative;display:flex;align-items:center;justify-content:center;border-bottom:1px solid var(--line);}
.space-media svg{width:40px;height:40px;color:var(--ochre-2);opacity:0.9;}
.space-media .lvl{position:absolute;top:10px;left:12px;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.08em;color:var(--ink-faint);}
.space-body{padding:16px 16px 18px;display:flex;flex-direction:column;gap:8px;flex:1;}
.space-body h3{font-size:16px;}
.space-body p{font-size:12.8px;color:var(--ink-dim);margin:0;flex:1;}
.space-foot{display:flex;align-items:center;justify-content:space-between;margin-top:6px;}

/* Events */
.event-row{
  display:flex;gap:16px;align-items:center;padding:16px;border:1px solid var(--line);border-radius:16px;
}
.event-date{
  width:56px;text-align:center;flex-shrink:0;border-right:1px solid var(--line);padding-right:14px;
}
.event-date .d{font-family:'Fraunces',serif;font-size:22px;font-weight:650;color:var(--bone);}
.event-date .m{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--ink-faint);letter-spacing:0.08em;text-transform:uppercase;}
.event-info{flex:1;min-width:0;}
.event-info h3{font-size:15.5px;margin-bottom:3px;}
.event-info .meta{font-size:12px;color:var(--ink-faint);font-family:'IBM Plex Mono',monospace;}
.event-actions{flex-shrink:0;}

/* Member / network */
.member-card{border:1px solid var(--line);border-radius:var(--arch);padding:18px;display:flex;flex-direction:column;gap:10px;}
.member-top{display:flex;gap:12px;align-items:center;}
.member-avatar{width:44px;height:44px;border-radius:var(--arch-sm);background:linear-gradient(160deg, var(--terracotta), var(--ochre));display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;font-weight:650;color:var(--on-accent);flex-shrink:0;}
.member-name{font-size:14.5px;font-weight:600;color:var(--bone);}
.member-sub{font-size:11.5px;color:var(--ink-faint);}
.match-reason{font-size:12px;color:var(--ink-dim);border-left:2px solid var(--ochre);padding-left:10px;line-height:1.5;}

/* Wallet card */
.brass-card{
  border-radius:20px;padding:26px 24px;position:relative;overflow:hidden;
  background:
    linear-gradient(135deg, rgba(200,154,68,0.22), transparent 55%),
    linear-gradient(155deg, #241C15, #10161F 70%);
  border:1px solid var(--card-ochre);
  min-height:190px;display:flex;flex-direction:column;justify-content:space-between;
  box-shadow:0 20px 50px -20px rgba(0,0,0,0.55);
  color:var(--card-ink);
}
.brass-card::after{
  content:'';position:absolute;inset:0;
  background:repeating-linear-gradient(115deg, rgba(244,235,218,0.03) 0 2px, transparent 2px 5px);
  mix-blend-mode:overlay;pointer-events:none;
}
.brass-top{display:flex;justify-content:space-between;align-items:flex-start;}
.brass-mark{font-family:'Fraunces',serif;font-weight:650;font-size:15px;letter-spacing:0.02em;color:var(--card-ink);}
.brass-mark small{display:block;font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--card-ochre-2);letter-spacing:0.14em;margin-top:2px;}
.brass-tier{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.1em;color:var(--card-ochre-2);border:1px solid var(--card-ochre);padding:4px 9px;border-radius:999px;}
.brass-num{font-family:'IBM Plex Mono',monospace;font-size:16px;letter-spacing:0.14em;color:var(--card-ink);opacity:0.85;}
.brass-bottom{display:flex;justify-content:space-between;align-items:flex-end;}
.brass-name{font-family:'Fraunces',serif;font-size:15px;color:var(--card-ink);}
.brass-since{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--card-ink-faint);}

/* Forms */
.field{margin-bottom:14px;}
.field label{display:block;font-size:11.5px;font-family:'IBM Plex Mono',monospace;letter-spacing:0.05em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:7px;}
select,input[type=text],input[type=date],textarea{
  width:100%;background:rgba(var(--tint-rgb),0.04);border:1px solid var(--line-strong);
  border-radius:10px;padding:11px 12px;color:var(--ink);font-family:'Inter',sans-serif;font-size:13.5px;
}
select:focus,input:focus,textarea:focus{outline:none;border-color:var(--ochre);}
textarea{resize:vertical;min-height:70px;}
.option-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;}
.option-chip{
  border:1px solid var(--line-strong);border-radius:12px;padding:10px;text-align:center;font-size:12.5px;
  background:rgba(var(--tint-rgb),0.02);
}
.option-chip.sel{border-color:var(--ochre);background:rgba(200,154,68,0.1);color:var(--ochre-2);}

/* Toggle switch */
.switch-row{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--line);}
.switch-row:last-child{border-bottom:none;}
.switch-row .t{font-size:13.5px;font-weight:500;color:var(--bone);}
.switch-row .d{font-size:12px;color:var(--ink-faint);margin-top:3px;max-width:420px;}
.switch{width:40px;height:23px;border-radius:999px;background:rgba(var(--tint-rgb),0.12);position:relative;flex-shrink:0;border:1px solid var(--line-strong);transition:background .15s;}
.switch::after{content:'';position:absolute;top:2px;left:2px;width:17px;height:17px;border-radius:50%;background:var(--ink-faint);transition:transform .15s, background .15s;}
.switch.on{background:rgba(200,154,68,0.28);border-color:var(--ochre);}
.switch.on::after{transform:translateX(17px);background:var(--ochre-2);}

/* Chat / Concierge */
.chatwrap{display:flex;flex-direction:column;height:calc(100vh - 210px);min-height:420px;border:1px solid var(--line);border-radius:var(--arch);overflow:hidden;background:rgba(var(--tint-rgb),0.015);}
@media (max-width:920px){.chatwrap{height:calc(100vh - 260px);}}
.chatlog{flex:1;overflow-y:auto;padding:22px;display:flex;flex-direction:column;gap:16px;}
.msg{max-width:78%;padding:12px 15px;border-radius:16px;font-size:13.8px;line-height:1.55;}
.msg.user{align-self:flex-end;background:linear-gradient(135deg, var(--terracotta), var(--terracotta-2));color:#1c0f08;border-bottom-right-radius:5px;}
.msg.ai{align-self:flex-start;background:rgba(var(--tint-rgb),0.05);border:1px solid var(--line);border-bottom-left-radius:5px;color:var(--ink);}
.msg.ai .aitag{font-family:'IBM Plex Mono',monospace;font-size:9.5px;color:var(--ochre-2);letter-spacing:0.1em;text-transform:uppercase;display:block;margin-bottom:6px;}
.msg.typing{display:flex;gap:4px;align-items:center;padding:14px 16px;}
.msg.typing span{width:5px;height:5px;border-radius:50%;background:var(--ochre-2);animation:tb 1.1s infinite ease-in-out;}
.msg.typing span:nth-child(2){animation-delay:0.15s;}
.msg.typing span:nth-child(3){animation-delay:0.3s;}
@keyframes tb{0%,60%,100%{opacity:0.25;transform:translateY(0);}30%{opacity:1;transform:translateY(-3px);}}
.chat-suggestions{display:flex;gap:8px;flex-wrap:wrap;padding:0 22px 14px;}
.suggest-chip{border:1px solid var(--line-strong);background:rgba(var(--tint-rgb),0.03);border-radius:999px;padding:7px 13px;font-size:12px;color:var(--ink-dim);}
.suggest-chip:hover{border-color:var(--ochre);color:var(--ochre-2);}
.chatform{display:flex;gap:10px;padding:16px;border-top:1px solid var(--line);}
.chatform textarea{flex:1;min-height:44px;max-height:120px;}
.chatform button{flex-shrink:0;}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(10,8,6,0.72);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;}
.modal{
  width:100%;max-width:480px;max-height:88vh;overflow-y:auto;
  background:var(--charcoal-2);border:1px solid var(--line-strong);border-radius:24px;
  padding:26px;box-shadow:var(--shadow);
}
.modal-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px;}
.modal-close{background:none;border:none;color:var(--ink-faint);width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;}
.modal-close:hover{color:var(--ink);background:rgba(var(--tint-rgb),0.06);}
.drawer{max-width:420px;margin-left:auto;border-radius:24px 4px 4px 24px;height:100%;max-height:100vh;}

/* Toast */
#toast-root{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;}
.toast{background:var(--charcoal-2);border:1px solid var(--ochre);border-radius:999px;padding:10px 18px;font-size:12.8px;color:var(--bone);box-shadow:var(--shadow);animation:toastin .2s ease;}
@keyframes toastin{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

/* Empty state */
.empty{border:1px dashed var(--line-strong);border-radius:18px;padding:34px 22px;text-align:center;color:var(--ink-faint);}
.empty h3{color:var(--ink-dim);margin-bottom:6px;font-size:15px;}

/* Threshold splash */
#splash{position:fixed;inset:0;background:var(--charcoal);z-index:500;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:18px;transition:opacity .5s ease;}
.splash-arch{width:110px;height:150px;border:1.5px solid var(--ochre);border-radius:80px 80px 6px 6px;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg, rgba(200,154,68,0.14), transparent);animation:archglow 2.4s ease-in-out infinite;}
@keyframes archglow{0%,100%{box-shadow:0 0 0 0 rgba(200,154,68,0);}50%{box-shadow:0 0 40px 6px rgba(200,154,68,0.12);}}
#splash h1{font-size:22px;letter-spacing:0.01em;}
#splash .eyebrow{margin-bottom:2px;}

.scroll-hide::-webkit-scrollbar{display:none;}

.fade-in{animation:fadein .35s ease both;}
@keyframes fadein{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
</style>
</head>
<body>
<div id="shell"></div>
<div id="modal-root"></div>
<div id="toast-root"></div>
<script>
/* ---------------- Database connection (Supabase) ----------------
   Both apps talk to one shared key/value table in Supabase. Staff sign in with a House account;
   the database itself decides what each role may read and change (row-level security).
   With no connection configured they keep using the platform's shared storage exactly as before. */
/* Open mode: no sign-in and no Supabase. To reconnect, rename _supabaseUrl/_supabaseKey back and set requireLogin:true. */
window.DH_CONFIG = window.DH_CONFIG || {_supabaseUrl:'https://eptsqnvenmllmzshigoi.supabase.co', _supabaseKey:'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVwdHNxbnZlbm1sbG16c2hpZ29pIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIwMDM2NjIsImV4cCI6MjEwNzU3OTY2Mn0.OXqgEbP29xHd_PpCHPa57WGoqwi3Xi_jwWIvem0cT5o', requireLogin:false};
const DH_DB = (function(){
  const LS = 'dh_sb', LSS = 'dh_session';
  const KEYS = ['ops:members','ops:spaces','ops:events','ops:souk_vendors','ops:academy_classes','ops:talent_directory','ops:language_tables','ops:locations','ops:activity_log','ops:applications','ops:circles','ops:requests','ops:bookings','ops:rsvps','ops:souk_reservations','ops:enrollments'];
  const db = {status:'off', lastError:'', KEYS, profile:null, onAuthLost:null};
  let underlying = window.storage;
  const mem = {};
  let session = null; try{ session = JSON.parse(localStorage.getItem(LSS)||'null'); }catch(e){}
  db.platform = () => underlying;
  db.config = function(){
    try{ const s = JSON.parse(localStorage.getItem(LS)||'null'); if(s && s.url && s.key) return {url:String(s.url).replace(/\/+$/,''), key:s.key, auth:false}; }catch(e){}
    const c = window.DH_CONFIG||{};
    return (c.supabaseUrl && c.supabaseKey) ? {url:String(c.supabaseUrl).replace(/\/+$/,''), key:c.supabaseKey, auth:!!c.requireLogin} : null;
  };
  db.save = (url,key) => { try{ localStorage.setItem(LS, JSON.stringify({url,key})); return true; }catch(e){ return false; } };
  db.clear = () => { try{ localStorage.removeItem(LS); }catch(e){} };
  db.active = () => !!db.config();
  db.authMode = () => { const c = db.config(); return !!(c && c.auth); };
  db.session = () => session;
  db.needsLogin = () => db.authMode() && !session;
  function setSession(j){
    session = {access_token:j.access_token, refresh_token:j.refresh_token, expires_at: j.expires_at || (Math.floor(Date.now()/1000)+(j.expires_in||3600)), user: j.user ? {id:j.user.id, email:j.user.email} : (session && session.user)};
    try{ localStorage.setItem(LSS, JSON.stringify(session)); }catch(e){}
  }
  db.signOutLocal = () => { session = null; db.profile = null; try{ localStorage.removeItem(LSS); }catch(e){} };
  async function fetchT(url, opts){
    const ctl = (typeof AbortController!=='undefined') ? new AbortController() : null;
    const t = ctl ? setTimeout(()=>ctl.abort(), 8000) : null;
    try{ return await fetch(url, Object.assign({signal: ctl?ctl.signal:undefined}, opts)); } finally { if(t) clearTimeout(t); }
  }
  db.refresh = async function(){
    const cfg = db.config(); if(!cfg || !session || !session.refresh_token) return false;
    try{
      const res = await fetchT(cfg.url+'/auth/v1/token?grant_type=refresh_token', {method:'POST', headers:{apikey:cfg.key, 'Content-Type':'application/json'}, body:JSON.stringify({refresh_token:session.refresh_token})});
      if(!res.ok){ db.signOutLocal(); if(db.onAuthLost) db.onAuthLost(); return false; }
      setSession(await res.json()); return true;
    }catch(e){ return false; }
  };
  async function call(cfg, path, opts, useSession){
    if(useSession!==false && session && session.expires_at && session.expires_at*1000 - Date.now() < 60000) await db.refresh();
    const send = () => fetchT(cfg.url+'/rest/v1/'+path, Object.assign({}, opts, {headers:Object.assign({apikey:cfg.key, Authorization:'Bearer '+((useSession!==false && session)?session.access_token:cfg.key), 'Content-Type':'application/json'}, (opts&&opts.headers)||{})}));
    let res = await send();
    if(res.status===401 && useSession!==false && session){ if(await db.refresh()) res = await send(); else { if(db.onAuthLost) db.onAuthLost(); } }
    return res;
  }
  function fail(msg){ db.status='error'; db.lastError=msg; throw new Error(msg); }
  async function sbGet(key){
    const cfg = db.config();
    let res; try{ res = await call(cfg, 'kv?key=eq.'+encodeURIComponent(key)+'&select=value'); }catch(e){ fail('Cannot reach the database ('+(e&&e.message||'network')+')'); }
    if(!res.ok) fail('Database said '+res.status);
    const rows = await res.json(); db.status='ok'; db.lastError='';
    if(!rows.length) throw new Error('not found');
    return {key, value: JSON.stringify(rows[0].value), shared:true};
  }
  async function sbSet(key, value){
    const cfg = db.config(); let parsed; try{ parsed = JSON.parse(value); }catch(e){ parsed = value; }
    let res; try{ res = await call(cfg, 'kv?on_conflict=key', {method:'POST', headers:{Prefer:'resolution=merge-duplicates,return=minimal'}, body:JSON.stringify({key, value:parsed})}); }catch(e){ fail('Cannot reach the database ('+(e&&e.message||'network')+')'); }
    if(!res.ok){
      if(res.status===401 || res.status===403){ db.lastError='Your role cannot change this ('+key+')'; throw new Error(db.lastError); }
      fail('Database refused the write ('+res.status+')');
    }
    db.status='ok'; db.lastError=''; return {key, value, shared:true};
  }
  const personalGet = async key => {
    if(underlying && typeof underlying.get==='function'){ try{ return await underlying.get(key,false); }catch(e){} }
    let v = null; try{ v = localStorage.getItem('dh_p_'+key); }catch(e){}
    if(v===null) v = (key in mem) ? mem[key] : null;
    if(v===null) throw new Error('not found');
    return {key, value:v, shared:false};
  };
  const personalSet = async (key, value) => {
    if(underlying && typeof underlying.set==='function'){ try{ return await underlying.set(key,value,false); }catch(e){} }
    mem[key]=value; try{ localStorage.setItem('dh_p_'+key, value); }catch(e){} return {key, value, shared:false};
  };
  const shim = {
    async get(key, shared){ if(shared===undefined) shared = false; return shared ? sbGet(key) : personalGet(key); },
    async set(key, value, shared){ if(shared===undefined) shared = false; return shared ? sbSet(key, value) : personalSet(key, value); },
  };
  try{
    Object.defineProperty(window, 'storage', {configurable:true, get(){ return db.active() ? shim : underlying; }, set(v){ underlying = v; }});
  }catch(e){}
  /* ---- sign in ---- */
  db.signIn = async function(email, password){
    const cfg = db.config(); if(!cfg) return {ok:false, msg:'No database is set up.'};
    const em = String(email||'').trim();
    let res; try{
      if(/@house\.diaspora\.test$/i.test(em)){ // mock demo accounts: any password opens them (server refuses real accounts)
        res = await fetchT(cfg.url+'/functions/v1/demo-login', {method:'POST', headers:{apikey:cfg.key, Authorization:'Bearer '+cfg.key, 'Content-Type':'application/json'}, body:JSON.stringify({email:em})});
      } else {
        res = await fetchT(cfg.url+'/auth/v1/token?grant_type=password', {method:'POST', headers:{apikey:cfg.key, 'Content-Type':'application/json'}, body:JSON.stringify({email:em, password:String(password||'')})});
      }
    }
    catch(e){ return {ok:false, msg:'Could not reach the sign-in service.'}; }
    if(!res.ok) return {ok:false, msg:'That email and password do not match.'};
    setSession(await res.json());
    const p = await db.loadProfile();
    if(!p){ db.signOutLocal(); return {ok:false, msg:'This account is not on the House team.'}; }
    return {ok:true, profile:p};
  };
  db.loadProfile = async function(){
    const cfg = db.config(); if(!cfg || !session) return null;
    try{
      const res = await call(cfg, 'staff_profiles?select=display_name,title,role,email&active=eq.true&user_id=eq.'+encodeURIComponent(session.user.id));
      if(!res.ok) return null;
      const rows = await res.json(); db.profile = rows[0] || null; return db.profile;
    }catch(e){ return null; }
  };
  db.team = async function(){
    const cfg = db.config(); if(!cfg || !session) return [];
    try{ const res = await call(cfg, 'staff_profiles?select=display_name,title,role,email&active=eq.true&order=role'); return res.ok ? await res.json() : []; }catch(e){ return []; }
  };
  db.signOut = async function(){
    const cfg = db.config();
    if(cfg && session){ try{ await fetchT(cfg.url+'/auth/v1/logout', {method:'POST', headers:{apikey:cfg.key, Authorization:'Bearer '+session.access_token}}); }catch(e){} }
    db.signOutLocal();
  };
  db.test = async function(url, key){
    const cfg = {url:String(url||'').trim().replace(/\/+$/,''), key:String(key||'').trim()};
    if(!/^https:\/\/.+/.test(cfg.url)) return {ok:false, msg:'The URL should start with https:// (find it in Supabase under Project Settings, API).'};
    if(!cfg.key) return {ok:false, msg:'Paste the anon public key.'};
    let res; try{ res = await call(cfg, 'kv?select=key&limit=1', undefined, false); }catch(e){ return {ok:false, msg:'Could not reach that address. '+(e&&e.message||'')}; }
    if(res.ok) return {ok:true, msg:'Connected. The kv table is there.'};
    let body = ''; try{ body = await res.text(); }catch(e){}
    if(res.status===404 || /PGRST205|relation .* does not exist|schema cache/i.test(body)) return {ok:false, msg:'Connected, but the kv table does not exist yet.'};
    if(res.status===401 || res.status===403) return {ok:false, msg:'Supabase refused the key. Check that it is the anon public key.'};
    return {ok:false, msg:'Supabase answered '+res.status+'.'};
  };
  db.migrate = async function(){
    const src = underlying; if(!src || typeof src.get!=='function') return {copied:0, skipped:0, none:true};
    let copied = 0, skipped = 0;
    for(const k of KEYS){
      let have = true; try{ await sbGet(k); }catch(e){ have = (e.message!=='not found'); }
      if(have){ skipped++; continue; }
      let r = null; try{ r = await src.get(k, true); }catch(e){}
      if(r && r.value!=null){ await sbSet(k, r.value); copied++; }
    }
    return {copied, skipped};
  };
  return db;
})();
function loginHTML(appName){
  return `
    <div class="modal-overlay">
      <div class="modal">
        <div class="modal-head"><div><h3>${esc(appName)}</h3><div class="sub">Sign in with your House account</div></div></div>
        <div class="field"><label>Email</label><input type="text" id="login-email" autocomplete="username" placeholder="you@house.diaspora.test"></div>
        <div class="field"><label>Password</label><input type="password" id="login-pw" autocomplete="current-password"></div>
        <div class="mono" style="font-size:10.5px;color:var(--text-faint);margin:2px 0 2px;">Demo team accounts (name@house.diaspora.test) open with any password.</div>
        <div id="login-msg" class="mono" style="font-size:11.5px;min-height:18px;margin:4px 0 12px;color:var(--bad, #d98080);"></div>
        <button class="btn btn-primary btn-block" data-action="db-signin">Sign in</button>
        <p class="mono" style="font-size:10.5px;color:var(--text-faint, #888);margin-top:12px;">What you can see and change depends on your role. Ask the House Director for access.</p>
      </div>
    </div>`;
}
function dbModalHTML(){
  const cfg = DH_DB.config(); const prof = DH_DB.profile;
  const st = !cfg ? 'Using the platform’s shared storage' : (DH_DB.status==='error' ? 'Database set, but the last call failed: '+DH_DB.lastError : 'Connected to '+cfg.url.replace(/^https:\/\//,'')+(cfg.auth?' with sign-in':''));
  return `
    <div class="modal-overlay" data-action="close-modal">
      <div class="modal" data-action="noop">
        <div class="modal-head">
          <div><h3>Database</h3><div class="sub">${esc(st)}</div></div>
          <button class="modal-close" data-action="close-modal">${ICON.close}</button>
        </div>
        ${prof ? `<p class="mono" style="font-size:11.5px;color:var(--text-faint, #888);">Signed in as ${esc(prof.display_name)} (${esc(prof.role)}). Access rules live in the database, in the role_access table.</p>` : ''}
        ${cfg && cfg.auth ? '' : `
        <div class="field"><label>Supabase project URL</label><input type="text" id="db-url" placeholder="https://abcdxyz.supabase.co" value="${esc(cfg?cfg.url:'')}"></div>
        <div class="field"><label>Anon public key</label><input type="text" id="db-key" placeholder="eyJhbGciOi…" value="${esc(cfg?cfg.key:'')}"></div>
        <div id="db-msg" class="mono" style="font-size:11.5px;min-height:18px;margin:4px 0 12px;color:var(--text-faint);"></div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;">
          <button class="btn btn-ghost btn-sm" data-action="db-test">Test connection</button>
          <button class="btn btn-primary btn-sm" data-action="db-save">Save and use</button>
          ${cfg?'<button class="btn btn-ghost btn-sm" data-action="db-migrate">Copy current data into Supabase</button><button class="btn btn-ghost btn-sm" data-action="db-disconnect">Disconnect</button>':''}
        </div>`}
        ${DH_DB.session() ? '<button class="btn btn-ghost btn-sm" data-action="db-signout">Sign out</button>' : ''}
      </div>
    </div>`;
}
function dbSay(msg, good){ const m = document.getElementById('db-msg'); if(m){ m.textContent = msg; m.style.color = good===true?'var(--ok, #6fbf8f)':(good===false?'var(--bad, #d98080)':'var(--text-faint)'); } }
function dbAction(action){
  const val = id => { const e = document.getElementById(id); return e ? e.value.trim() : ''; };
  if(action==='open-db'){ state.modal = {type:'db'}; renderModal(); return true; }
  if(action==='db-signin'){
    const msg = document.getElementById('login-msg'); if(msg) msg.textContent = 'Signing in…';
    DH_DB.signIn(val('login-email'), document.getElementById('login-pw') ? document.getElementById('login-pw').value : '').then(r=>{
      if(!r.ok){ const m = document.getElementById('login-msg'); if(m) m.textContent = r.msg; return; }
      if(typeof dhAfterLogin==='function') dhAfterLogin();
    });
    return true;
  }
  if(action==='db-signout'){ DH_DB.signOut().then(()=>{ try{ location.reload(); }catch(e){} }); return true; }
  if(action==='db-test'){ dbSay('Testing…'); DH_DB.test(val('db-url'), val('db-key')).then(r=>dbSay(r.msg, r.ok)); return true; }
  if(action==='db-save'){
    dbSay('Checking before saving…');
    DH_DB.test(val('db-url'), val('db-key')).then(r=>{
      if(!r.ok){ dbSay(r.msg, false); return; }
      DH_DB.save(val('db-url').replace(/\/+$/,''), val('db-key'));
      dbSay('Saved. Reloading to use it…', true);
      setTimeout(()=>{ try{ location.reload(); }catch(e){} }, 400);
    });
    return true;
  }
  if(action==='db-disconnect'){ DH_DB.clear(); dbSay('Disconnected. Reloading…', true); setTimeout(()=>{ try{ location.reload(); }catch(e){} }, 400); return true; }
  if(action==='db-migrate'){
    dbSay('Copying…');
    DH_DB.migrate().then(r=>dbSay(r.none ? 'No platform storage to copy from.' : `Copied ${r.copied} data sets. ${r.skipped} already existed and were left alone.`, true)).catch(e=>dbSay('Copy failed: '+e.message, false));
    return true;
  }
  return false;
}
document.addEventListener('keydown', e=>{ if(e.key==='Enter' && e.target && e.target.id==='login-pw'){ dbAction('db-signin'); } });

  faraday:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 4v16M16 4v16M4 8h16M4 16h16"/></svg>`,

function toast(msg){
  const id = Math.random().toString(36).slice(2);

  setTimeout(()=>{ state.toasts = state.toasts.filter(t=>t.id!==id); renderToasts(); }, 3200);
}

/* ---------------- Event helpers ---------------- */
const TODAY = new Date('2026-08-09T00:00:00');
function fmtDate(iso){
  const dt = new Date(iso+'T00:00:00');
  return { day: dt.getDate(), month: dt.toLocaleString('en-US',{month:'short'}), weekday: dt.toLocaleString('en-US',{weekday:'short'}), dt };
}
function daysUntil(iso){ const dt = new Date(iso+'T00:00:00'); return Math.round((dt-TODAY)/86400000); }
const BASE_RSVP_GUESTS = {e1:1, e4:0};   // RSVPs the demo member starts with; moved out of the base "going" count so they are counted once
Object.keys(BASE_RSVP_GUESTS).forEach(id=>{ const ev = EVENTS.find(x=>x.id===id); if(ev) ev.going = Math.max(0, ev.going-(1+BASE_RSVP_GUESTS[id])); });
function mySeatCount(e){ return state.rsvps.has(e.id) ? 1+(state.rsvpGuests[e.id]||0) : 0; }
function goingTotal(e){ return e.going + (state.otherSeats[e.id]||0) + mySeatCount(e); }
function seatsLeft(e){ return Math.max(0, e.capacity - e.held - goingTotal(e)); }
function eventStatus(e){ if(state.rsvps.has(e.id)) return 'going'; if(state.waitlist.has(e.id)) return 'waitlist'; return 'open'; }
function guestPassesUsed(excludeId){ return Object.entries(state.rsvpGuests).reduce((sum,[id,g])=> sum + (id===excludeId?0:(g||0)), 0); }
function guestPassesRemaining(excludeId){ return MEMBER.guestPasses - guestPassesUsed(excludeId); }
function upcomingEvents(){ return EVENTS.filter(e=> !e.cancelled && (daysUntil(e.date) >= 0 || eventStatus(e)!=='open')); }
function eventById(id){ return EVENTS.find(e=>e.id===id); }

function downloadICS(e){
  const m = e.time.match(/(\d+):(\d+)\s*(AM|PM)/i);
  let hh = m ? parseInt(m[1],10) : 19, mm = m ? parseInt(m[2],10) : 0;
  const ap = m ? m[3].toUpperCase() : 'PM';
  if(ap==='PM' && hh!==12) hh += 12;
  if(ap==='AM' && hh===12) hh = 0;
  const [y,mo,da] = e.date.split('-').map(Number);
  const pad = n => String(n).padStart(2,'0');
  const start = `${y}${pad(mo)}${pad(da)}T${pad(hh)}${pad(mm)}00`;
  const endDt = new Date(y,mo-1,da,hh+2,mm,0);
  const end = `${endDt.getFullYear()}${pad(endDt.getMonth()+1)}${pad(endDt.getDate())}T${pad(endDt.getHours())}${pad(endDt.getMinutes())}00`;
  const stamp = start;
  const ics = [
    'BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Diaspora House//Club Brain//EN','BEGIN:VEVENT',
    `UID:${e.id}@diasporahouse`, `DTSTAMP:${stamp}`, `DTSTART:${start}`, `DTEND:${end}`,
    `SUMMARY:${e.name.replace(/,/g,'\\,')}`, `LOCATION:${e.room.replace(/,/g,'\\,')}`,
    `DESCRIPTION:${e.desc.replace(/,/g,'\\,').replace(/\n/g,'\\n')}`,
    'END:VEVENT','END:VCALENDAR'
  ].join('\r\n');
  const blob = new Blob([ics], {type:'text/calendar'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = e.name.toLowerCase().replace(/[^a-z0-9]+/g,'-').slice(0,60) + '.ics';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
  toast('Calendar file downloaded.');
}

async function sendChat(text){
  if(!text || !text.trim() || state.chatBusy) return;
  state.chat.push({role:'user', text:text.trim()});
  state.chatBusy = true;
  renderView();
  try{
    const history = state.chat.slice(-10).map(m=>({role: m.role==='user'?'user':'assistant', content:m.text}));
    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({
        model:"claude-sonnet-4-6",
        max_tokens:700,
        system: conciergeSystem(),
        messages: history,
      })
    });
    const data = await response.json();
    const textBlocks = (data.content||[]).filter(b=>b.type==='text').map(b=>b.text);
    const reply = textBlocks.join('\n\n').trim() || "I'm here — could you say that once more? The line crackled for a moment.";

const TIME_SLOTS = ["9:00 AM","11:00 AM","1:00 PM","3:30 PM","6:00 PM","8:00 PM"];

function wingOf(space){ return space.level.split(' — ')[1]; }
function hashStr(s){ let h=0; for(let i=0;i<s.length;i++){ h=(h*31+s.charCodeAt(i))|0; } return Math.abs(h); }
function slotTakenByOther(spaceId, date){
  const space = SPACES.find(s=>s.id===spaceId);
  if(!space.exclusive) return -1; // shared spaces have no single-slot exclusivity
  return hashStr(spaceId+date) % TIME_SLOTS.length;
}
function slotsTaken(spaceId, date){
  const space = SPACES.find(s=>s.id===spaceId);
  const set = new Set();
  if(!space || !space.exclusive) return set;      // shared rooms never restrict
  set.add(hashStr(spaceId+date) % TIME_SLOTS.length);
  state.otherBookings.forEach(b=>{ if(b.spaceId===spaceId && b.date===date){ const i = TIME_SLOTS.indexOf(b.time); if(i>-1) set.add(i); } });
  return set;
}

function profileComplete(){ return !!(state.capitalProfile.need.trim() && state.capitalProfile.bring.trim()); }
function tagHits(text, tags){
  const t = (text||'').toLowerCase();
  return tags.filter(tag=>{
    // plural-looking tags also match their singular (founders -> founder); words like logistics/customs stay as-is
    const plural = /s$/.test(tag) && !/(ics|ss)$/.test(tag) && tag!=='customs';
    const stem = (plural ? tag.slice(0,-1) : tag).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
    return new RegExp('(^|[^a-z])'+stem+'s?([^a-z]|$)','i').test(t);
  });
}
function scoreMatch(m){
  const p = state.capitalProfile;
  const A = tagHits(p.need, m.bringTags||[]);        // what I need, they bring
  const B = tagHits(p.bring, m.needTags||[]);        // what I bring, they need
  const C = tagHits(p.building, m.bringTags||[]).filter(t=>!A.includes(t)); // overlap with what I'm building
  return {score: A.length*3 + B.length*2 + C.length, A, B, C};
}
function matchReason(m, s){
  const parts = [];
  if(s.A.length) parts.push(`You're looking for ${s.A.slice(0,2).join(' and ')}, and ${m.short} brings ${s.A.length>1?'them':'it'}.`);
  if(s.B.length) parts.push(`${m.short} is looking for ${s.B.slice(0,2).join(' and ')}, and that's what you bring.`);
  if(!parts.length && s.C.length) parts.push(`${m.short}'s work overlaps with what you're building (${s.C[0]}).`);
  return parts.join(' ');
}

async function syncCircleSeat(c, delta){

  if(!rec) return 'local';

function drawAncestralMap(){
  const canvas = document.getElementById('ancestral-map');
  if(!canvas) return;
  const ctx = canvas.getContext('2d');
  const w = canvas.clientWidth, h = 220;
  canvas.width = w * devicePixelRatio; canvas.height = h * devicePixelRatio;
  ctx.scale(devicePixelRatio, devicePixelRatio);
  const cities = [
    {x:0.08,y:0.5,name:'NYC'},{x:0.18,y:0.28,name:'DC'},{x:0.16,y:0.72,name:'ATL'},
    {x:0.30,y:0.55,name:'HOU'},{x:0.55,y:0.42,name:'LON'},{x:0.62,y:0.62,name:'DKR'},
    {x:0.72,y:0.5,name:'ACC'},{x:0.80,y:0.45,name:'LOS'},{x:0.88,y:0.58,name:'NBO'},{x:0.92,y:0.72,name:'JNB'}
  ];
  const links = [[0,1],[0,2],[0,3],[0,4],[4,5],[4,6],[6,7],[7,8],[8,9],[3,6],[1,4]];
  const light = state.theme === 'light';
  const palette = light
    ? { link:'rgba(156,114,35,0.35)', travel:'rgba(177,88,50,0.85)', dot:'#241B10', text:'rgba(42,33,21,0.55)' }
    : { link:'rgba(200,154,68,0.28)', travel:'rgba(226,137,90,0.9)', dot:'#F1E7D6', text:'rgba(241,231,214,0.5)' };
  let t = 0;
  function frame(){
    ctx.clearRect(0,0,w,h);
    ctx.strokeStyle = palette.link;
    ctx.lineWidth = 1;
    links.forEach(([a,b],i)=>{
      const c1 = cities[a], c2 = cities[b];
      const x1=c1.x*w, y1=c1.y*h, x2=c2.x*w, y2=c2.y*h;
      ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
      const prog = (t*0.15 + i*0.31) % 1;
      const px = x1 + (x2-x1)*prog, py = y1 + (y2-y1)*prog;
      ctx.beginPath(); ctx.arc(px,py,2,0,7); ctx.fillStyle=palette.travel; ctx.fill();
    });
    cities.forEach(c=>{
      const x=c.x*w, y=c.y*h;
      ctx.beginPath(); ctx.arc(x,y,3.4,0,7); ctx.fillStyle=palette.dot; ctx.fill();
      ctx.font = '9.5px IBM Plex Mono, monospace'; ctx.fillStyle=palette.text;
      ctx.fillText(c.name, x+6, y+3);
    });
    t += 1;
  }
  frame();
  if(window.__mapInterval) clearInterval(window.__mapInterval);
  window.__mapInterval = setInterval(frame, 90);
}

  if(state.modal.type==='space'){
    const s = SPACES.find(sp=>sp.id===state.modal.id);
    const pairId = SPACE_PAIRINGS[s.id];
    const pair = pairId ? SPACES.find(sp=>sp.id===pairId) : null;
    root.innerHTML = `
      <div class="modal-overlay" data-action="close-modal">

  if(state.modal.type==='book'){
    const spaceId = state.modal.spaceId;
    const s = SPACES.find(sp=>sp.id===spaceId);
    const rescheduleIdx = (typeof state.modal.rescheduleIdx==='number') ? state.modal.rescheduleIdx : null;
    const existing = (rescheduleIdx!=null) ? state.bookings[rescheduleIdx] : null;
    const min = TODAY.toISOString().slice(0,10);
    const initialDate = existing ? existing.date : min;
    const initialTaken = slotsTaken(spaceId, initialDate);
    const initialSelected = existing ? existing.time : (TIME_SLOTS.find((t,i)=> !initialTaken.has(i)) || TIME_SLOTS[0]);
    const selectedAddons = existing ? (existing.addons||[]) : [];

    function timeGridHTML(date, selTime){
      const taken = slotsTaken(spaceId, date);
      return TIME_SLOTS.map((t,i)=>{
        const disabled = s.exclusive && taken.has(i) && !(existing && existing.date===date && existing.time===t);
        const sel = t===selTime && !disabled;
        return `<button type="button" class="option-chip ${sel?'sel':''}" data-time="${t}" ${disabled?'disabled':''} style="${disabled?'opacity:.35;cursor:not-allowed;':''}">${t}${disabled?' · Reserved':''}</button>`;
      }).join('');
    }

    root.innerHTML = `
      <div class="modal-overlay" data-action="close-modal">
        <div class="modal" data-action="noop">
          <div class="modal-head">
            <div><div class="eyebrow">${existing?'Reschedule':'Reserve'}</div><h3 style="font-size:19px;margin-top:2px;">${esc(s.name)}</h3></div>
            <button class="modal-close" data-action="close-modal">${ICON.close}</button>
          </div>
          <p class="muted" style="font-size:13px;margin:8px 0 18px;">${esc(s.desc)}</p>
          <div class="field"><label>Date</label><input type="date" id="book-date" min="${min}" value="${initialDate}"></div>

          </div>
          ${s.addons.length? `
          <div class="field"><label>Add-on services (optional)</label>
            <div id="book-addons" style="display:flex;flex-direction:column;gap:8px;">
              ${s.addons.map(a=>`<label style="display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-dim);"><input type="checkbox" value="${esc(a)}" ${selectedAddons.includes(a)?'checked':''}> ${esc(a)}</label>`).join('')}
            </div>
          </div>` : ''}
          <div class="field"><label>Notes for the House (optional)</label><textarea id="book-notes" placeholder="e.g. dietary notes, guest count…">${existing?esc(existing.notes||''):''}</textarea></div>
          <button class="btn btn-primary btn-block" data-action="confirm-book" data-id="${s.id}">${existing?'Save changes':'Confirm reservation'}</button>

    function attachChipListeners(){
      document.querySelectorAll('#book-times .option-chip:not([disabled])').forEach(chip=>{
        chip.addEventListener('click', ()=>{
          document.querySelectorAll('#book-times .option-chip').forEach(c=>c.classList.remove('sel'));
          chip.classList.add('sel');
        });
      });
    }
    attachChipListeners();
    document.getElementById('book-date').addEventListener('change', (evt)=>{
      const grid = document.getElementById('book-times');
      const currentSel = grid.querySelector('.option-chip.sel');
      const keepTime = currentSel ? currentSel.dataset.time : initialSelected;
      grid.innerHTML = timeGridHTML(evt.target.value, keepTime);
      attachChipListeners();
    });
    return;
  }
  if(state.modal.type==='login'){ root.innerHTML = loginHTML('Diaspora House'); return; }
  if(state.modal.type==='db'){ root.innerHTML = dbModalHTML(); return; }
  if(state.modal.type==='profile'){
    root.innerHTML = `
      <div class="modal-overlay" data-action="close-modal">
        <div class="modal drawer" data-action="noop">
          <div class="modal-head">
            <div><div class="eyebrow">${esc(MEMBER.memberNo)}</div><h3 style="font-size:19px;margin-top:2px;">${esc(MEMBER.name)}</h3></div>
            <button class="modal-close" data-action="close-modal">${ICON.close}</button>
          </div>
          <p class="faint" style="font-size:12.5px;margin:2px 0 20px;">${esc(MEMBER.tier)} · Home: ${esc(MEMBER.home)} · Based: ${esc(MEMBER.base)}</p>

          ${canPreview() ? previewBlockHTML() : accountBlockHTML()}

          <div class="eyebrow" style="margin-bottom:10px;">Capital Profile</div>
          <div style="margin-bottom:24px;">
            <p class="faint" style="font-size:12.5px;margin:0 0 10px;">${profileComplete() ? 'Saved. Your Network matches use it.' : 'Not completed yet. Add what you need and what you bring to get better introductions.'}</p>
            <button class="btn btn-ghost btn-sm" data-action="open-capital-profile">${profileComplete() ? 'Edit Capital Profile' : 'Complete Capital Profile'}</button>
          </div>

          <div class="eyebrow" style="margin-bottom:10px;">Scent profile</div>
          <div class="option-grid" id="scent-grid" style="margin-bottom:24px;">
            ${SCENT_OPTIONS.map(sc=>`<button type="button" class="option-chip ${sc===MEMBER.scent?'sel':''}" data-scent="${esc(sc)}">${esc(sc)}</button>`).join('')}
          </div>

          <div class="eyebrow" style="margin-bottom:4px;">Privacy &amp; data sovereignty</div>
          <div style="margin-bottom:20px;">
            ${switchRow('closedLoop','Closed-loop AI','Your data trains no model outside this House and is never sold.')}
            ${switchRow('nonCustodial','Non-custodial data','Diaspora House acts as facilitator only — you retain ownership of your records.')}
            ${switchRow('biometric','Facial recognition entry','Opt-in keyless arrival at the Welcome Gallery.')}
            ${switchRow('dataSharing','Share insights with sister houses','Allow anonymized preferences to sync with Lagos, Accra &amp; Nairobi houses.')}
          </div>

          <div class="eyebrow" style="margin-bottom:4px;">Stealth &amp; Security</div>
          <div style="margin-bottom:20px;">
            ${switchRow('aliasEnabled','Alias Bookings','Book restaurants and travel under a verified House alias to avoid unwanted attention.', 'security')}
            ${state.security.aliasEnabled ? `
              <div class="field" style="margin-top:12px;">
                <label>Your booking alias</label>
                <div style="display:flex;gap:8px;">
                  <input type="text" id="alias-name-input" placeholder="e.g. A. Adeyemi" value="${esc(state.security.aliasName)}">
                  <button class="btn btn-ghost btn-sm" data-action="save-alias">Save</button>
                </div>
              </div>
            ` : ''}
            <div class="switch-row">
              <div><div class="t">Cyber-Suite Audit</div><div class="d">${state.cyberAuditScheduled ? "Scheduled — the IT team will secure your personal devices and home network." : 'An annual digital security "physical" for your devices and home network.'}</div></div>
              <button type="button" class="btn ${state.cyberAuditScheduled?'btn-ghost':'btn-primary'} btn-sm" data-action="schedule-cyber-audit" ${state.cyberAuditScheduled?'disabled':''}>${state.cyberAuditScheduled?'Scheduled ✓':'Schedule'}</button>
            </div>
            <p class="faint" style="font-size:11.5px;margin-top:12px;line-height:1.6;">Your Black Brass Card already grants Dry Entry — the unbranded side entrance with direct elevator access from the secure underground garage.</p>
          </div>

          <div class="eyebrow" style="margin-bottom:4px;">Notifications</div>
          <div>
            ${switchRow('culturalAlerts','Cultural sentiment alerts','Flash Salons when something big happens back home.', 'notif')}
            ${switchRow('investmentPods','Investment Pod matches','AI-matched syndicate opportunities.', 'notif')}
            ${switchRow('eventReminders','Event reminders','A nudge before things you have RSVP\'d to.', 'notif')}
          </div>
        </div>
      </div>`;
    document.querySelectorAll('#scent-grid .option-chip').forEach(chip=>{
      chip.addEventListener('click', ()=>{
        MEMBER.scent = chip.dataset.scent;
        document.querySelectorAll('#scent-grid .option-chip').forEach(c=>c.classList.remove('sel'));
        chip.classList.add('sel');
        toast('Scent profile updated to ' + MEMBER.scent);
      });
    });
  }
}
function switchRow(key,title,desc,group){
  const bag = group==='notif' ? state.notif : group==='security' ? state.security : state.privacy;
  const on = bag[key];
  return `<div class="switch-row">
    <div><div class="t">${esc(title)}</div><div class="d">${desc}</div></div>
    <button type="button" class="switch ${on?'on':''}" data-action="toggle" data-group="${group||'privacy'}" data-key="${key}"></button>
  </div>`;
}

/* ---------------- Init / render loop ---------------- */
function render(){
  document.documentElement.setAttribute('data-theme', state.theme);
  renderShell();
  renderView();
  renderModal();
  renderToasts();
}

/* ---------------- Event delegation ---------------- */
document.addEventListener('click', async (e)=>{
  const el = e.target.closest('[data-action]');
  if(!el) return;
  const action = el.dataset.action;

  if(action==='noop'){ return; }
  if(action.startsWith('db-') || action==='open-db'){ dbAction(action); return; }
  if(action==='view-as'){ if(!canPreview()){ toast('Only the CEO can preview other members.'); return; } await switchMember(el.dataset.no); return; }
  if(action==='toggle-theme'){ state.theme = state.theme==='dark'?'light':'dark'; render(); return; }
  if(action==='nav'){ state.view = el.dataset.view; render(); return; }
  if(action==='profile'){ state.modal = {type:'profile'}; renderModal(); return; }
  if(action==='close-modal'){ state.modal = null; renderModal(); return; }
  if(action==='notifications'){ toast('You are all caught up.'); return; }

  if(action==='open-event'){ state.modal = {type:'event', id: el.dataset.id}; renderModal(); return; }
  if(action==='filter-cat'){ state.eventFilter = el.dataset.cat; renderView(); return; }
  if(action==='events-tab'){ state.eventTab = el.dataset.tab; renderView(); return; }

  if(action==='confirm-rsvp'){
    const id = el.dataset.id;
    const select = document.getElementById('event-guest-select');
    const guests = select ? Number(select.value) : 0;
    const remaining = guestPassesRemaining(id);
    if(guests > remaining){ toast(`Only ${remaining} guest pass${remaining===1?'':'es'} available.`); return; }
    (async()=>{
      await hydrateShared();                       // pick up seats other members took since this screen opened
      const ev = eventById(id);
      const alreadyIn = state.rsvps.has(id);
      const need = alreadyIn ? guests-(state.rsvpGuests[id]||0) : 1+guests;
      if(need>0 && seatsLeft(ev) < need){
        if(alreadyIn){ toast('Not enough seats left for that many guests.'); return; }
        state.modal = null; renderModal();
        state.waitlist.add(id);
        toast('That table just filled. You are on the waitlist.');
        renderView();
        writeRsvp(id, 'waitlist');
        return;
      }
      state.rsvps.add(id); state.waitlist.delete(id); state.rsvpGuests[id] = guests;
      state.modal = null; renderModal();
      toast('You are on the list' + (guests? ` with ${guests} guest${guests>1?'s':''}` : '') + '.');
      renderView();
      writeRsvp(id, 'going');
    })();
    return;
  }
  if(action==='cancel-rsvp'){
    const id = el.dataset.id;
    state.rsvps.delete(id); delete state.rsvpGuests[id];
    writeRsvp(id, 'cancelled');
    state.modal = null; renderModal();
    toast('RSVP cancelled — your seat returns to the Empty Chair pool.');
    renderView(); return;
  }
  if(action==='join-waitlist'){
    const id = el.dataset.id;
    state.waitlist.add(id);
    writeRsvp(id, 'waitlist');
    state.modal = null; renderModal();
    toast("Added to the waitlist — we'll notify you if a seat opens.");
    renderView(); return;
  }
  if(action==='leave-waitlist'){
    const id = el.dataset.id;
    state.waitlist.delete(id);
    writeRsvp(id, 'cancelled');
    state.modal = null; renderModal();
    toast('Removed from the waitlist.');
    renderView(); return;
  }
  if(action==='add-calendar'){ downloadICS(eventById(el.dataset.id)); return; }

  if(action==='open-production'){ state.modal = {type:'production'}; renderModal(); return; }
  if(action==='submit-production'){
    const type = document.getElementById('prod-type').value;
    state.modal = null; renderModal();
    const pd = (document.getElementById('prod-date')||{}).value, pg = (document.getElementById('prod-guests')||{}).value, pn = (document.getElementById('prod-notes')||{}).value;
    submitRequest('Production request', `${type} request`, `Date: ${pd||'not set'}. Guests: ${pg||'not set'}. Notes: ${pn||'none'}.`).then(requestToast(`${type} request sent — the production team will follow up within 48 hours.`));
    return;
  }

  if(action==='open-space'){ state.modal = {type:'space', id: el.dataset.id}; renderModal(); return; }
  if(action==='filter-house'){ state.spaceHouse = el.dataset.house; state.spaceFilter = 'All'; renderView(); return; }
  if(action==='filter-wing'){ state.spaceFilter = el.dataset.wing; renderView(); return; }
  if(action==='open-book'){ state.modal = {type:'book', spaceId: el.dataset.id, rescheduleIdx: null}; renderModal(); return; }
  if(action==='reschedule-booking'){
    const idx = Number(el.dataset.idx);
    const b = state.bookings[idx];
    state.modal = {type:'book', spaceId: b.spaceId, rescheduleIdx: idx};
    renderModal(); return;
  }
  if(action==='confirm-book'){
    const spaceId = el.dataset.id;
    const date = document.getElementById('book-date').value;
    const timeChip = document.querySelector('#book-times .option-chip.sel:not([disabled])');
    if(!timeChip){ toast('Please choose an available time.'); return; }
    const time = timeChip.dataset.time;
    const rescheduleIdx = (state.modal && typeof state.modal.rescheduleIdx==='number') ? state.modal.rescheduleIdx : null;
    const conflictIdx = hasTimeConflict(date, time, rescheduleIdx);
    if(conflictIdx !== -1){ toast('You already have another reservation at that time.'); return; }
    const space = SPACES.find(sp=>sp.id===spaceId);
    const takenNow = slotsTaken(spaceId, date);
    const isOwnSlot = rescheduleIdx!=null && state.bookings[rescheduleIdx] && state.bookings[rescheduleIdx].date===date && state.bookings[rescheduleIdx].time===time && state.bookings[rescheduleIdx].spaceId===spaceId;
    if(space.exclusive && takenNow.has(TIME_SLOTS.indexOf(time)) && !isOwnSlot){ toast('That slot is already held — please choose a different time.'); return; }
    const addonEls = document.querySelectorAll('#book-addons input:checked');
    const addons = addonEls ? Array.from(addonEls).map(cb=>cb.value) : [];
    const notes = document.getElementById('book-notes').value;
    const prevId = (rescheduleIdx!=null && state.bookings[rescheduleIdx]) ? state.bookings[rescheduleIdx].id : null;
    const bookingObj = {id: prevId || newBookingId(), spaceId, date, time, addons, notes};
    (async()=>{
      if(space.exclusive){
        const clash = await bookingClash(bookingObj);   // someone may have taken it since this screen opened
        if(clash){
          toast(clash.status==='blocked' ? 'The House has that room held at that time. Please choose another.' : 'Someone just reserved that slot. Please choose another.');
          await hydrateShared();
          if(state.modal && state.modal.type==='book') renderModal();
          return;
        }
      }
      if(rescheduleIdx != null){
        state.bookings[rescheduleIdx] = bookingObj;
        toast('Reservation updated.');
      } else {
        state.bookings.push(bookingObj);
        toast('Reservation confirmed — the House is expecting you.');
      }
      state.modal = null; renderModal();
      if(state.view==='spaces') renderView();
      writeBooking(bookingObj, 'confirmed');
    })();
    return;
  }
  if(action==='cancel-booking'){
    const gone = state.bookings.splice(Number(el.dataset.idx),1)[0];
    if(gone && gone.id) writeBooking(gone, 'cancelled');
    toast('Reservation cancelled.'); renderView(); return;
  }
  if(action==='add-booking-calendar'){ downloadICS(bookingToICS(state.bookings[Number(el.dataset.idx)])); return; }

  if(action==='anticip-accept'){ toast('Arranged. The Club Brain will confirm shortly.'); return; }
  if(action==='anticip-dismiss'){ el.closest('.pulse-card').style.opacity='0.35'; toast('Noted — we\'ll leave it be.'); return; }

  if(action==='intro'){
    state.introRequests.add(el.dataset.name);
    const p = state.capitalProfile;
    submitRequest('Introduction', `Introduction with ${el.dataset.name}`, profileComplete() ? `Needs: ${p.need}. Brings: ${p.bring}.${p.building?' Building: '+p.building+'.':''}` : 'Member has not completed a Capital Profile.')
      .then(requestToast(profileComplete() ? `Introduction requested with ${el.dataset.name}. They'll see your Capital Profile.` : `Introduction requested with ${el.dataset.name}.`));
    if(state.view==='network') renderView();
    return;
  }
  if(action==='dismiss-match'){ state.dismissedMatches.add(el.dataset.name); renderView(); return; }
  if(action==='join-circle'){
    const c = circleById(el.dataset.id);
    if(!c) return;
    if(state.circleJoins.has(c.id)){ return; }
    if(circleSeatsOpen(c)<=0){ toast('That table is full. You can join the waitlist.'); renderView(); return; }
    state.circleJoins.add(c.id); state.circleWaitlist.delete(c.id);
    toast(`Your seat at ${c.name} is held. The host will see your Capital Profile.`);
    renderView();
    syncCircleSeat(c, +1).then(res=>{
      if(res==='full'){ state.circleJoins.delete(c.id); toast(`${c.name} filled up just now. You can join the waitlist.`); hydrateCircles().then(()=>renderView()); }
    });
    return;
  }
  if(action==='leave-circle'){
    const c = circleById(el.dataset.id);
    if(!c) return;
    state.circleJoins.delete(c.id);
    toast('Your seat has been released.');
    renderView();
    syncCircleSeat(c, -1);
    return;
  }
  if(action==='waitlist-circle'){
    const c = circleById(el.dataset.id); if(!c) return;
    state.circleWaitlist.add(c.id); toast(`You're on the waitlist for ${c.name}.`); renderView(); return;
  }
  if(action==='leave-circle-waitlist'){
    const c = circleById(el.dataset.id); if(!c) return;
    state.circleWaitlist.delete(c.id); toast('Removed from the waitlist.'); renderView(); return;
  }
  if(action==='circle-calendar'){
    const c = circleById(el.dataset.id); if(!c) return;
    downloadICS({id:c.id, name:c.name, date:c.date, time:c.time, room:c.room, desc:c.desc});
    return;
  }
  if(action==='toggle-requests'){ state.showAllRequests = !state.showAllRequests; renderView(); return; }
  if(action==='open-capital-profile'){ state.modal = {type:'capital-profile'}; renderModal(); return; }
  if(action==='save-capital-profile'){
    const building = document.getElementById('cp-building').value.trim();
    const need = document.getElementById('cp-need').value.trim();
    const bring = document.getElementById('cp-bring').value.trim();
    if(!bring){ toast('Tell us what you bring. Every member contributes something.'); return; }
    if(!need){ toast('Tell us what you need so we can match you.'); return; }
    state.capitalProfile = {building, need, bring};
    state.modal = null; renderModal();
    toast('Capital Profile saved. Your matches have been re-ordered.');
    if(state.view==='network') renderView();
    return;
  }
  if(action==='join-pod'){ submitRequest('Investment pod', `Join ${POD.name}`, '').then(requestToast(`You've asked to join the ${POD.name}. The fund team will confirm.`)); return; }

  if(action==='filter-talent'){ state.talentFilter = el.dataset.cat; renderView(); return; }
  if(action==='open-talent'){ state.modal = {type:'talent', id: el.dataset.id}; renderModal(); return; }
  if(action==='request-talent-intro'){
    const t = talentById(el.dataset.id);
    state.modal = null; renderModal();
    submitRequest('Talent introduction', `Introduction with ${t.name} (${t.role||'talent'})`, `Vouched by ${t.vouchedBy}.`).then(requestToast(`Introduction requested with ${t.name} — the Club Brain will loop in ${t.vouchedBy}.`));
    return;
  }

  if(action==='book-genealogist'){ submitRequest('Genealogist', 'Genealogist session requested', '').then(requestToast('Genealogist session requested — you will hear back within 24 hours.')); return; }
  if(action==='book-oralhistory'){ submitRequest('Oral history', 'Oral History Booth requested', '').then(requestToast('Oral History Booth held for you — the Club Brain will confirm a time.')); return; }
  if(action==='open-archive'){ toast(`Opening "${el.dataset.name}"…`); return; }

  if(action==='redeem'){ const rw = REWARDS.find(r=>r.name===el.dataset.name); submitRequest('Rewards redemption', `Redeem: ${el.dataset.name}`, rw?`Cost: ${rw.cost}. Member balance: ${MEMBER.points.toLocaleString()} pts.`:'').then(requestToast(`Redemption requested: ${el.dataset.name}. The House will confirm and update your balance.`)); return; }

  if(action==='open-wall'){ state.modal = {type:'wall'}; renderModal(); return; }
  if(action==='open-vault'){ state.modal = {type:'vault'}; renderModal(); return; }
  if(action==='add-vault-item'){
    const input = document.getElementById('vault-item-input');
    const val = input.value.trim();
    if(!val){ toast('Enter an item first.'); return; }
    state.vaultItems.push(val);
    renderModal();
    toast('Added to your locker.');
    return;
  }
  if(action==='remove-vault-item'){
    state.vaultItems.splice(Number(el.dataset.idx),1);
    renderModal();
    return;
  }
  if(action==='request-vault-visit'){
    state.modal = null; renderModal();
    submitRequest('Vault visit', 'Vault visit requested', 'Locker items: '+(state.vaultItems.join('; ')||'none listed')+'.').then(requestToast('Vault visit requested — staff will have your locker ready.'));
    return;
  }
  if(action==='open-shadow'){ state.modal = {type:'shadow'}; renderModal(); return; }
  if(action==='toggle-shadow-rsvp'){
    state.shadowRSVP = !state.shadowRSVP;
    if(state.shadowRSVP){ toast("You're on the list for the Shadow Committee dinner."); }
    else { toast('Your seat has been released.'); }
    renderModal();
    return;
  }
  if(action==='open-line'){ state.modal = {type:'line'}; renderModal(); return; }
  if(action==='send-concierge-message'){
    const msg = document.getElementById('line-message').value.trim();
    if(!msg){ toast('Write a quick message first.'); return; }
    state.modal = null; renderModal();
    submitRequest('Concierge message', msg.length>70 ? msg.slice(0,67)+'...' : msg, msg).then(requestToast('Sent directly to the Club Manager.'));
    return;
  }
  if(action==='open-reciprocal'){ state.modal = {type:'reciprocal'}; renderModal(); return; }

  if(action==='open-report'){ state.modal = {type:'market-report', id: el.dataset.id}; renderModal(); return; }
  if(action==='open-vendor'){ state.modal = {type:'vendor', id: el.dataset.id}; renderModal(); return; }
  if(action==='reserve-souk-item'){
    const pid = el.dataset.id;
    const found = soukProductById(pid);
    if(!found) return;
    if(state.busyReserve) return;
    state.busyReserve = true;
    try{
      await hydrateShared();                      // pick up stock and reservations changed since this screen opened
      if(soukLeft(found.product)<=0 || await reserveClash(pid,1)){ toast('That piece is fully reserved for this drop.'); renderModal(); if(state.view==='souk') renderView(); return; }
      const rec = {id:'sr-'+Date.now().toString(36)+Math.random().toString(36).slice(2,6), productId: pid, qty: 1, date: TODAY.toISOString().slice(0,10), status:'reserved'};
      const ok = await writeReservation(rec, 'reserved');
      state.soukReservations.push(rec);
      requestToast(`Reserved: ${found.product.name} at $${found.product.price}.`)(ok || !sharedAvailable());
    } finally { state.busyReserve = false; }
    renderModal();
    if(state.view==='souk') renderView();
    return;
  }
  if(action==='cancel-souk-reservation'){
    const gone = state.soukReservations.splice(Number(el.dataset.idx),1)[0];
    if(gone) await writeReservation(gone, 'cancelled');
    toast('Reservation cancelled.');
    renderView();
    return;
  }
  if(action==='open-souk-request'){ state.modal = {type:'souk-request'}; renderModal(); return; }
  if(action==='submit-souk-request'){
    const name = document.getElementById('souk-req-name').value.trim();
    if(!name){ toast('Add a brand name first.'); return; }
    const cityEl = document.getElementById('souk-req-city'), notesEl = document.getElementById('souk-req-notes');
    const sent = submitRequest('Brand suggestion', `Brand suggestion: ${name}`, [cityEl&&cityEl.value.trim()?('City: '+cityEl.value.trim()):'', notesEl?notesEl.value.trim():''].filter(Boolean).join(' · '), 'normal');
    state.modal = null; renderModal();
    sent.then(requestToast(`Thank you — Direct Trade Sourcing will look into ${name}.`));
    return;
  }

  if(action==='add-child'){
    const nameEl = document.getElementById('child-name-input');
    const ageEl = document.getElementById('child-age-input');
    const name = nameEl.value.trim();
    const age = ageEl.value.trim();
    if(!name || !age || isNaN(Number(age))){ toast('Add a name and a valid age.'); return; }
    state.children.push({id:'child-'+Date.now()+Math.random().toString(36).slice(2,6), name, age:Number(age)});
    renderView();
    toast(`${name} added.`);
    return;
  }
  if(action==='remove-child'){
    const idx = Number(el.dataset.idx);
    const child = state.children[idx];
    state.children.splice(idx,1);
    if(child){
      const drop = state.enrollments.filter(e=>e.childId===child.id);
      state.enrollments = state.enrollments.filter(e=>e.childId!==child.id);
      for(const e of drop) await writeEnrollment({...e, childName:child.name, childAge:child.age}, 'cancelled');
    }
    renderView();
    toast('Child removed.');
    return;
  }
  if(action==='open-enroll'){ state.modal = {type:'enroll', classId: el.dataset.id}; renderModal(); return; }
  if(action==='confirm-enroll'){
    const classId = el.dataset.id;
    const select = document.getElementById('enroll-child-select');
    const childId = select ? select.value : null;
    if(!childId){ toast('Choose a child first.'); return; }
    const cls = classById(classId);
    const already = state.enrollments.some(e=>e.classId===classId && e.childId===childId);
    if(already){ toast('Already enrolled in this class.'); return; }
    if(state.busyEnroll) return;
    state.busyEnroll = true;
    let ok = true;
    try{
      await hydrateShared();                      // pick up spots taken since this screen opened
      const left = Math.max(0, cls.capacity - enrolledCountFor(classId));
      if(left<=0 || await classFull(classId)){ toast('That class just filled up.'); renderModal(); if(state.view==='academy') renderView(); return; }
      ok = await writeEnrollment({classId, childId}, 'enrolled');
      state.enrollments.push({classId, childId});
    } finally { state.busyEnroll = false; }
    state.modal = null; renderModal();
    const child = state.children.find(c=>c.id===childId);
    requestToast(`${child?child.name:'Child'} enrolled in ${cls.name}.`)(ok || !sharedAvailable());
    if(state.view==='academy') renderView();
    return;
  }
  if(action==='cancel-enrollment'){
    const gone = state.enrollments.splice(Number(el.dataset.idx),1)[0];
    if(gone) await writeEnrollment(gone, 'cancelled');
    toast('Enrollment cancelled.');
    renderView();
    return;
  }
  if(action==='open-naming-room'){ state.modal = {type:'naming-room'}; renderModal(); return; }
  if(action==='submit-naming'){
    const name = document.getElementById('naming-child-name').value.trim();
    if(!name){ toast("Add the child's name first."); return; }
    const dob = document.getElementById('naming-dob').value;
    const ceremonyDate = document.getElementById('naming-ceremony-date').value;
    const notes = document.getElementById('naming-notes').value;
    state.namingRegistrations.push({name, dob, ceremonyDate, notes});
    const sent = submitRequest('Naming Room', `Naming ceremony for ${name}`, [dob?('Born: '+dob):'', ceremonyDate?('Preferred date: '+ceremonyDate):'', notes].filter(Boolean).join(' · '), 'normal');
    state.modal = null; renderModal();
    sent.then(requestToast(`${name} will be welcomed into the Village. The Naming Room will confirm your date.`));
    return;
  }

  if(action==='toggle'){
    const bag = el.dataset.group==='notif' ? state.notif : el.dataset.group==='security' ? state.security : state.privacy;
    bag[el.dataset.key] = !bag[el.dataset.key];
    renderModal();
    return;
  }
  if(action==='save-alias'){
    const input = document.getElementById('alias-name-input');
    const name = input.value.trim();
    if(!name){ toast('Enter an alias name first.'); return; }
    state.security.aliasName = name;
    renderModal();
    toast(`External bookings will now go out under "${name}."`);
    return;
  }
  if(action==='schedule-cyber-audit'){
    state.cyberAuditScheduled = true;
    renderModal();
    toast('Cyber-Suite Audit scheduled — the IT team will reach out within 48 hours.');
    return;
  }

  if(action==='chat-suggest'){ state.modal = null; state.view = 'concierge'; render(); sendChat(el.dataset.text); return; }

  if(action==='toggle-table'){
    const id = el.dataset.id;
    if(state.tableJoins.has(id)){ state.tableJoins.delete(id); toast('Left the table.'); }
    else { state.tableJoins.add(id); toast("You're on the list for this table."); }
    renderView();
    return;
  }
  if(action==='open-tutor'){
    const lang = el.dataset.lang;
    if(state.tutorLanguage !== lang){
      state.tutorLanguage = lang;
      state.tutorChat = [{role:'ai', text: lang==='Kiswahili' ? "Habari! Let's practice Kiswahili together. Unatoka wapi? (Where are you from?)" : `Let's practice ${lang} together. Tell me a little about yourself, in ${lang} or English — whatever feels natural.`}];
    }
    state.modal = {type:'tutor'};
    renderModal();
    return;
  }
});

document.addEventListener('submit', (e)=>{
  if(e.target.id==='chatform'){
    e.preventDefault();
    const input = document.getElementById('chatinput');
    const text = input.value;
    input.value = '';
    sendChat(text);
  }
  if(e.target.id==='tutorchatform'){
    e.preventDefault();
    const input = document.getElementById('tutorchatinput');
    const text = input.value;
    input.value = '';
    sendTutorMessage(text);
  }
});
document.addEventListener('keydown',(e)=>{
  if(e.target && e.target.id==='chatinput' && e.key==='Enter' && !e.shiftKey){
    e.preventDefault();
    document.getElementById('chatform').requestSubmit();
  }
  if(e.target && e.target.id==='tutorchatinput' && e.key==='Enter' && !e.shiftKey){
    e.preventDefault();
    document.getElementById('tutorchatform').requestSubmit();
  }
});

/* ---------------- Boot ---------------- */
function boot(){
  document.getElementById('shell').style.opacity = 0;
  render();
  hydrateCircles(); refreshMyRequests(); hydrateShared();
  setInterval(()=>{ hydrateCircles(); refreshMyRequests(); hydrateShared(); }, 20000);
  const splash = document.createElement('div');
  splash.id = 'splash';
  splash.innerHTML = `
    <div class="splash-arch">${ICON.arch}</div>
    <div style="text-align:center;">
      <div class="eyebrow">The Village</div>
      <h1>Diaspora House</h1>
    </div>
  `;
  document.body.appendChild(splash);
  setTimeout(()=>{
    splash.style.opacity = 0;
    document.getElementById('shell').style.transition='opacity .5s ease';
    document.getElementById('shell').style.opacity = 1;
    setTimeout(()=>{ splash.remove(); drawAncestralMap(); }, 500);
  }, 1200);
}
/* Open access: no sign-in screen. Signs in silently as the shared account named in DH_CONFIG.openLogin. */
async function dhOpenSignIn(){
  const em = (window.DH_CONFIG && window.DH_CONFIG.openLogin) || 'ceo@house.diaspora.test';
  try{ const r = await DH_DB.signIn(em, ''); return !!(r && r.ok); }catch(e){ return false; }
}
async function bootGate(){
  if(DH_DB.authMode()){
    if(DH_DB.session() && !DH_DB.profile) await DH_DB.loadProfile();
    if(!DH_DB.session() || !DH_DB.profile){
      DH_DB.signOutLocal();
      if(await dhOpenSignIn()){ boot(); return; }
      state.modal = {type:'login'}; renderModal();
      return;
    }
  }
  boot();
}
DH_DB.onAuthLost = async () => { if(await dhOpenSignIn()){ location.reload(); return; } state.modal = {type:'login'}; renderModal(); };
function dhAfterLogin(){ state.modal = null; renderModal(); boot(); }
bootGate();
window.addEventListener('resize', ()=>{ if(state.view==='heritage') drawAncestralMap(); });
</script>
